    6: [[10, 10], [26, 10], [10, 24], [26, 24], [10, 38], [26, 38]],
    7: [[7, 10], [18, 8], [29, 10], [10, 25], [26, 25], [10, 38], [26, 38]],
    8: [[10, 7], [26, 7], [10, 18], [26, 18], [10, 30], [26, 30], [10, 41], [26, 41]],
    9: [[7, 10], [18, 10], [29, 10], [7, 24], [18, 24], [29, 24], [7, 38], [18, 38], [29, 38]]
  };
  const calligraphy = (character, y, size, color) =>
    '<text x="18" y="' + y + '" text-anchor="middle" font-family="Songti SC, Noto Serif CJK SC, serif" font-size="' + size + '" font-weight="800" fill="' + color + '">' + character + '</text>';

  function face(tile) {
    if (tile === null) return '<svg viewBox="0 0 36 48" aria-hidden="true"><g fill="none" stroke="#a4c29b" stroke-width="1.3"><rect x="6" y="6" width="24" height="36" rx="4"/><path d="m18 14 10 10-10 10-10-10Z m-5 10h10m-5-5v10"/></g></svg>';
    const k = Mahjong.kind(tile);
    const rare = Mahjong.isRed(tile);
    const key = k * 2 + Number(rare);
    if (faces.has(key)) return faces.get(key);
    const n = Mahjong.rank(k) + 1;
    const family = Mahjong.suit(k);
    let art;
    if (family === 0) {
      art = calligraphy(Mahjong.DIGITS[n - 1], 21, 23, rare ? red : dark) + calligraphy('萬', 41, 20, red);
    } else if (family === 1 && n === 1) {
      art = '<circle cx="18" cy="24" r="13" fill="none" stroke="' + cobalt + '" stroke-width="2.6"/>' +
        '<circle cx="18" cy="24" r="9.7" fill="none" stroke="' + forest + '" stroke-width="1.3"/>' +
        '<path d="M18 15c4 6 4 12 0 18-4-6-4-12 0-18ZM9 24c6-4 12-4 18 0-6 4-12 4-18 0Z" fill="' + forest + '"/>' +
        '<circle cx="18" cy="24" r="3" fill="' + red + '"/>';
    } else if (family === 1) {
      const radius = n <= 3 ? 5.4 : n >= 7 ? 3.9 : 4.7;
      art = positions[n].map(([x, y], i) => {
        const color = rare || (n === 5 && i === 2) || (n === 9 && i >= 3 && i < 6) ? red :
          (i % 3 === 0 ? forest : cobalt);
        return '<circle cx="' + x + '" cy="' + y + '" r="' + radius + '" fill="none" stroke="' + color + '" stroke-width="1.8"/>' +
          '<circle cx="' + x + '" cy="' + y + '" r="' + (radius * .45) + '" fill="' + color + '"/>';
      }).join('');
    } else if (family === 2 && n === 1) {
      art = '<path d="M7 36c5-7 4-12 11-14 5-2 4-7 9-8l4 3-5 2c1 9-5 16-11 18l-8 3 3-5Z" fill="' + forest + '"/>' +
        '<path d="M14 33c6 0 9-4 10-9-5 1-8 4-10 9Z" fill="#91a46a"/><circle cx="27" cy="17" r="1" fill="#f2edd9"/>' +
        '<path d="M8 11h9m-7-4 5 8m0-8-4 8" stroke="' + red + '" stroke-width="1.35" stroke-linecap="round"/>';
    } else if (family === 2) {
      const height = n >= 7 ? 8 : n >= 4 ? 11 : 13;
      art = positions[n].map(([x, y], i) => {
        const color = rare || (n === 5 && i === 2) || (n === 7 && i < 3) || (n === 9 && i >= 3 && i < 6) ? red : forest;
        return '<rect x="' + (x - 2.35) + '" y="' + (y - height / 2) + '" width="4.7" height="' + height +
          '" rx="2" fill="' + color + '"/><path d="M' + (x - 1.6) + ' ' + y + 'h3.2" stroke="#e5ddbb" stroke-width=".75"/>';
      }).join('');
    } else if (k === 31) {
      art = '<rect x="7" y="9" width="22" height="30" rx="3" fill="none" stroke="' + cobalt +
        '" stroke-width="2.4"/><rect x="10.5" y="12.5" width="15" height="23" rx="1.3" fill="none" stroke="' + cobalt +
        '" stroke-width=".9"/><path d="M7 14l5-5m12 0 5 5M7 34l5 5m12 0 5-5" fill="none" stroke="' + cobalt + '" stroke-width="1.15"/>';
    } else {
      art = calligraphy('東南西北白發中'[k - 27], 33, 29, k === 32 ? forest : k === 33 ? red : dark);
    }
    if (rare) art += '<circle cx="30.6" cy="5.6" r="2" fill="' + red + '"/>';
    const svg = '<svg viewBox="0 0 36 48" aria-hidden="true">' + art + '</svg>';
    faces.set(key, svg);
    return svg;
  }

  function tile(id, extra = '', action = false, disabled = false) {
    const cls = 'tile' + (id === null ? ' is-back' : '') + (extra ? ' ' + extra : '');
    const name = id === null ? '牌背' : Mahjong.tileName(id);
    if (action) return '<button type="button" class="' + cls + '" aria-label="' + name + '" aria-pressed="' +
      String(extra.includes('selected')) + '" data-action="tile" data-tile="' + id + '"' +
      (disabled ? ' disabled' : '') + '>' + face(id) + '</button>';
    return '<span class="' + cls + '" role="img" aria-label="' + name + '" title="' + name + '">' + face(id) + '</span>';
  }

  function meld(m) {
    const label = m.type === 'chi' ? '吃' : m.type === 'pon' ? '碰' : m.open ? '明杠' : '暗杠';
    return '<span class="meld-group" aria-label="' + label + '">' +
      m.tiles.map((t, i) => tile(!m.open && (i === 0 || i === 3) ? null : t, t === m.called ? 'called-tile' : '')).join('') +
      '</span>';
  }

  return { icon, tile, meld };
})();

</script>
  <script>
(() => {
  const M = Mahjong;
  const { Game, NAMES, RELICS, stageName } = Endless;
  const { icon, tile, meld } = Art;
  const $ = id => document.getElementById(id);
  const prefix = 'aotenjo.v1.';
  const windFace = '東南西北';
  const windEnglish = ['EAST', 'SOUTH', 'WEST', 'NORTH'];
  const avatar = ['', 'fox', 'crow', 'crane'];
  const fmt = value => String(value).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const pad = n => String(n).padStart(2, '0');
  const sign = n => BigInt(n) > 0n ? '+' + fmt(n) : fmt(n);
  const wind = k => windFace[k - 27];
  const relicFor = id => RELICS.find(r => r.id === id);
  const header = (title, symbol, aside = '') => '<div class="panel-title"><h2>' + icon(symbol) + title +
    '</h2>' + (aside ? '<small>' + aside + '</small>' : '') + '</div>';
  const compact = (n, length = 8) => {
    const exact = fmt(n);
    if (exact.length <= length) return exact;
    const raw = String(n);
    const digits = raw.replace('-', '');
    return (raw.startsWith('-') ? '-' : '') + digits[0] + '.' + digits.slice(1, 3) + 'e' + (digits.length - 1);
  };

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(prefix + key)) ?? fallback; }
    catch { return fallback; }
  }

  let storageOK = true;
  function save(key, value) {
    try { localStorage.setItem(prefix + key, JSON.stringify(value)); }
    catch { storageOK = false; }
  }

  const snapshot = load('run', null);
  const validRun = snapshot?.version === 1 && snapshot.table?.players?.length === 4 &&
    snapshot.relics?.every(id => relicFor(id)) && /^[0-9]+$/.test(snapshot.goal);
  let game = new Game(validRun ? snapshot : null);
  const records = load('records', { floor: 1, cleared: 0, single: '0', total: '0' });
  const prefs = load('prefs', { sound: false, auto: false });
  let selected = null;
  let riichiMode = false;
  let highlight = false;
  let kanMode = false;
  let overlay = null;
  let helpTab = 'play';
  let aiTimer;
  let toastTimer;
  let context;
  let analysisMemo;
  let lastAnnouncement = '';

  function button(label, action, options = {}) {
    const { glyph, type, disabled, attr = '', tiles = [] } = options;
    return '<button type="button" class="action-btn ' + (type ?? '') +
      (tiles.length ? ' tiles-option' : '') + '" data-action="' + action + '"' +
      (disabled ? ' disabled' : '') + (attr ? ' ' + attr : '') + '>' +
      (glyph ? icon(glyph) : '') + label + tiles.map(t => tile(t)).join('') + '</button>';
  }

  function note(message) {
    $('toast').textContent = message;
    $('toast').classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('visible'), 2350);
  }

  function playSound(type = 'click') {
    if (!prefs.sound) return;
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      context ??= new Audio();
      if (context.state === 'suspended') context.resume().catch(() => {});
      const notes = type === 'win' ? [440, 554, 659] : type === 'call' ? [300, 440] : [245];
      notes.forEach((frequency, i) => {
        const start = context.currentTime + i * .065;
        const wave = context.createOscillator();
        const gain = context.createGain();
        wave.type = type === 'click' ? 'triangle' : 'sine';
        wave.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.001, start);
        gain.gain.exponentialRampToValueAtTime(.06, start + .012);
        gain.gain.exponentialRampToValueAtTime(.001, start + .105);
        wave.connect(gain);
        gain.connect(context.destination);
        wave.start(start);
        wave.stop(start + .12);
      });
    } catch { /* Audio is optional when the browser disallows playback. */ }
  }

  function updateStorage() {
    const run = game.s;
    records.floor = Math.max(records.floor, run.floor);
    records.cleared = Math.max(records.cleared, run.floor - 1 + Number(Boolean(game.t.result?.clear)));
    if (BigInt(run.highest) > BigInt(records.single)) records.single = run.highest;
    if (BigInt(run.total) > BigInt(records.total)) records.total = run.total;
    save('run', run);
    save('records', records);
  }

  function renderNav() {
    $('records').innerHTML = icon('trophy') + '<span class="record-text">最高层</span><strong>' +
      pad(records.floor) + '</strong>';
    $('sound').innerHTML = icon(prefs.sound ? 'sound' : 'mute');
    $('sound').setAttribute('aria-label', prefs.sound ? '关闭音效' : '开启音效');
    $('sound').setAttribute('aria-pressed', String(prefs.sound));
    $('save-state').innerHTML = icon('save') + (storageOK ? '本机自动存档' : '本机存档不可用');
  }

  function renderRun() {
    const s = game.s;
    const percent = Number(BigInt(s.progress) * 10000n / BigInt(s.goal)) / 100;
    $('challenge').innerHTML = '<div class="panel-body"><div class="floor-marker"><b>第 ' + pad(s.floor) +
      ' 层</b><span class="stage-label">' + stageName(s.floor) + '</span></div>' +
      '<div class="challenge-meter"><div class="challenge-caption">本层和牌分</div><div class="challenge-score">' +
      '<strong title="' + fmt(s.progress) + '">' + compact(s.progress, 7) + '</strong>' +
      '<span title="目标 ' + fmt(s.goal) + '">/ ' + compact(s.goal, 7) + '</span></div>' +
      '<div class="track" role="progressbar" aria-label="本层过关进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      Math.min(100, Math.floor(percent)) + '"><span style="width:' + Math.min(100, percent) + '%"></span></div></div>' +
      '<div class="life"><span>余命</span><span class="hearts" aria-label="' + s.hearts + ' 命，最多 4 命">' +
      Array.from({ length: 4 }, (_, i) => '<span' + (i < s.hearts ? ' class="full"' : '') + '>' + icon('heart') + '</span>').join('') +
      '</span></div></div>';

    const first = Math.max(1, s.floor - 1);
    $('route').innerHTML = '<div class="panel-body">' + header('挑战路线', 'route', 'ASCENT') +
      '<ol class="route-list">' + Array.from({ length: 4 }, (_, i) => {
        const level = first + i;
        const state = level < s.floor ? 'done' : level === s.floor ? 'current' : '';
        return '<li class="' + state + '"' + (state === 'current' ? ' aria-current="step"' : '') +
          '><span class="route-node">' + (state === 'done' ? icon('check') : pad(level)) +
          '</span><span class="route-text"><b>' + stageName(level) + '</b><small>' +
          (state === 'done' ? '已通过' : state === 'current' ? '当前牌局' : '尚未到达') + '</small></span></li>';
      }).join('') + '</ol><div class="route-infinity">∞ &nbsp; 向上无尽</div></div>';

    const owned = [...new Set(s.relics)].map(id => [relicFor(id), s.relics.filter(other => other === id).length]);
    $('relics').innerHTML = '<div class="panel-body">' + header('遗物匣', 'box', pad(s.relics.length)) +
      (!owned.length ? '<div class="relic-empty">' + icon('gem') + '<div><b>空的遗物匣</b>达成本层目标，三选一。</div></div>' :
        '<div class="relic-list">' + owned.map(([r, n]) => '<div class="relic-row"><span class="relic-icon">' +
          icon(r.glyph) + '</span><div><b>' + r.name + '</b><small>' + r.effect + '</small></div>' +
          (n > 1 ? '<em>×' + n + '</em>' : '') + '</div>').join('') + '</div>') + '</div>';
  }

  function seatCard(index) {
    const p = game.t.players[index];
    const isTurn = game.t.turn === index && game.t.phase === 'turn';
    const klass = game.seat(index) === 27 ? ' class="dealer"' : '';
    return '<div class="seat-card seat-' + index + (isTurn ? ' current' : '') + '" aria-label="' +
      NAMES[index] + '，' + wind(game.seat(index)) + '家，' + fmt(p.points) + '点' + (p.riichi ? '，已立直' : '') + '">' +
      '<span class="avatar">' + icon(avatar[index]) + '</span><div><div class="seat-name"><em' + klass + '>' +
      wind(game.seat(index)) + '</em>' + NAMES[index] + (p.riichi ? '<span class="seat-state">立直</span>' : '') +
      '</div><span class="seat-points">' + compact(p.points, 9) + '</span></div>' +
      (p.melds.length ? '<div class="seat-melds">' + p.melds.map(meld).join('') + '</div>' : '') + '</div>';
  }

  function river(index) {
    const t = game.t;
    const rows = t.players[index].river.filter(row => !row.called);
    const columns = rows.length > 21 ? ' river-eight' : rows.length > 18 ? ' river-seven' : '';
    return '<div class="river river-' + index + columns + '" aria-label="' + NAMES[index] + '的牌河">' +
      (rows.length ? rows.map(row => tile(row.tile, [
        row.riichi ? 'riichi-tile' : '',
        t.last?.from === index && t.last.tile === row.tile ? 'latest' : ''
      ].filter(Boolean).join(' '))).join('') :
        '<i class="empty-tile"></i>'.repeat(6)) + '</div>';
  }

  function renderTable() {
    const t = game.t;
    $('board-top').innerHTML = '<div class="round-tag"><span class="wind-box">' + wind(game.round) +
      '</span><span>' + game.roundName() + '</span><small>' + t.honba + ' 本场</small></div>' +
      '<div class="board-stats"><div class="wall-count">' + icon('layers') + '余牌<strong>' + t.live.length + '</strong></div>' +
      '<div class="dora-block"><span>宝牌指示</span><span class="dora-tray">' +
      game.indicators.map(id => tile(id)).join('') + '<i class="tile-spacer"></i>'.repeat(5 - game.indicators.length) +
      '</span></div></div>';
    $('felt').innerHTML = ['tl', 'tr', 'bl', 'br'].map(cls =>
      '<div class="felt-corner ' + cls + '">' + icon('corner') + '</div>').join('') +
      '<span class="felt-index">TABLE ' + pad(game.s.hands + 1) + '</span><span class="felt-mode">AOTENJŌ</span>' +
      [2, 3, 1].map(seatCard).join('') + [2, 3, 1, 0].map(river).join('') +
      '<div class="compass" aria-hidden="true"><i class="pip n"></i><i class="pip e"></i><i class="pip s"></i><i class="pip w"></i><b>' +
      wind(game.round) + '</b><small>' + windEnglish[game.round - 27] + ' · ' + (t.roundIndex % 4 + 1) + '</small></div>' +
      (t.pot ? '<span class="stick" aria-label="' + t.pot + ' 根立直棒"><i></i>×' + t.pot + '</span>' : '');
  }

  function analysis() {
    if (analysisMemo) return analysisMemo;
    const t = game.t;
    const p = game.you;
    const ownTurn = t.phase === 'turn' && t.turn === 0;
    const legal = ownTurn ? game.legalDiscards(0) : [];
    const options = legal.length ? game.options(0, 15) : [];
    const visible = game.visible(0);
    const riichi = ownTurn ? game.riichiDiscards(0) : [];
    const kans = ownTurn ? game.selfKans(0) : [];
    const tsumo = ownTurn ? game.canTsumo(0) : null;
    analysisMemo = { ownTurn, legal, options, visible, riichi, kans, tsumo };
    return analysisMemo;
  }

  function currentTurn() {
    const t = game.t;
    if (t.phase === 'resolved') return ['结算', 'wait'];
    if (t.phase === 'reaction') return [t.reaction.offers[0].type === 'ron' ? '可荣和' : '可鸣牌', 'attn'];
    if (t.turn !== 0) return [NAMES[t.turn] + '的回合', 'wait'];
    if (game.you.riichi) return [prefs.auto ? '立直 · 自动摸切' : '立直中', ''];
    return [game.you.drawType === 'call' ? '鸣牌后打出一张' : '轮到你', ''];
  }

  function reactionControls() {
    const r = game.t.reaction;
    const offers = r.offers;
    const message = NAMES[r.from] + (r.kan ? '宣告杠' : '打出') + '<strong>' + M.tileName(r.tile) + '</strong>';
    const controls = [button('跳过', 'pass', { type: 'quiet' })];
    for (const option of offers) {
      const name = { ron: '荣和', chi: '吃', pon: '碰', kan: '杠' }[option.type];
      controls.push(button(name, 'react', {
        type: option.type === 'ron' ? 'win' : 'primary',
        glyph: option.type === 'ron' ? 'bolt' : undefined,
        tiles: option.type === 'chi' ? [...option.tiles, r.tile].sort(M.byTile) : [],
        attr: 'data-option="' + option.id + '"'
      }));
    }
    return [message, controls];
  }

  function turnControls(a) {
    const p = game.you;
    const controls = [];
    let message = selected === null ? '选一张手牌' : '已选 <strong>' + M.tileName(selected) + '</strong>';
    if (a.tsumo) message = '<strong>可以自摸</strong> · ' + a.tsumo.han + ' 翻 ' + a.tsumo.fu + ' 符';
    if (riichiMode) message = '选择能立直的打牌';
    if (kanMode) {
      const options = a.kans.map(option => button(option.type === 'closed' ? '暗杠' : '加杠', 'kan', {
        type: 'primary', tiles: [option.tiles[0]], attr: 'data-option="' + option.id + '"'
      }));
      return ['选择杠牌', [button('取消', 'show-kan', { type: 'quiet' }), ...options]];
    }
    if (p.riichi) {
      controls.push(button(prefs.auto ? '自动切牌开' : '自动切牌关', 'auto', {
        type: 'quiet', attr: 'aria-pressed="' + prefs.auto + '"'
      }));
    } else {
      controls.push(button('提示', 'hint', { glyph: 'hint', type: 'quiet', attr: 'aria-pressed="' + highlight + '"' }));
    }
    if (!riichiMode && a.kans.length) controls.push(button('杠', 'show-kan'));
    if (a.riichi.length) controls.push(button(riichiMode ? '取消立直' : '立直', 'riichi', {
      type: 'riichi-ready', glyph: 'flag', attr: 'aria-pressed="' + riichiMode + '"'
    }));
    if (a.tsumo) controls.push(button('自摸', 'tsumo', { type: 'win', glyph: 'bolt' }));
    controls.push(button(riichiMode ? '确认立直' : p.riichi ? '摸切' : '打出', 'discard', {
      type: 'primary', glyph: 'arrow', disabled: selected === null && !p.riichi
    }));
    return [message, controls];
  }

  function renderConsole(keepFocus = false) {
    const a = analysis();
    const p = game.you;
    const t = game.t;
    const [turnLabel, turnClass] = currentTurn();
    const legal = riichiMode ? a.riichi : a.legal;
    const best = a.options[0];
    const hinted = riichiMode ? a.riichi : highlight && best ? a.options
      .filter(o => o.distance === best.distance && o.outs === best.outs).map(o => o.tile) : [];
    const tiles = p.tiles.filter(id => id !== p.drawn).sort(M.byTile);
    if (p.drawn !== null) tiles.push(p.drawn);
    const renderTile = id => tile(id, [
      id === p.drawn ? 'drawn' : '',
      id === selected ? 'selected' : '',
      hinted.includes(id) ? 'hinted' : '',
      a.ownTurn && !legal.includes(id) ? 'locked' : '',
      t.result?.winner === 0 && t.result.winning === id ? 'winning-tile' : ''
    ].filter(Boolean).join(' '), true, !a.ownTurn || !legal.includes(id));
    const [message, controls] = t.phase === 'reaction' ? reactionControls() :
      a.ownTurn ? turnControls(a) : [t.phase === 'resolved' ? '本局结算' : '等待其他玩家出牌', []];
    $('hand-ui').innerHTML = '<div class="hand-meta"><span class="your-wind">' + wind(game.seat(0)) +
      '</span><span class="you-name">你' + (game.seat(0) === 27 ? ' · 庄家' : '') + '</span><span class="you-points" title="' +
      fmt(p.points) + '">' + compact(p.points, 10) + '</span><span class="turn-pill ' + turnClass +
      '"><i class="live-dot"></i>' + turnLabel + '</span></div>' +
      (p.melds.length ? '<div class="melds" aria-label="你的副露">' + p.melds.map(meld).join('') + '</div>' : '') +
      '<div class="hand-row" aria-label="你的手牌">' + tiles.map(renderTile).join('') + '</div>' +
      '<div class="action-area"><div class="action-left">' + icon('info') + '<span>' + message + '</span></div>' +
      '<div class="action-buttons">' + controls.join('') + '</div></div>';
    if (keepFocus && selected !== null) $('hand-ui').querySelector('[data-tile="' + selected + '"]')?.focus({ preventScroll: true });
    if (turnLabel !== lastAnnouncement) {
      $('announcement').textContent = turnLabel;
      lastAnnouncement = turnLabel;
    }
  }

  function renderAdvisor() {
    const a = analysis();
    const p = game.you;
    let distance = M.shanten(p.tiles, p.melds);
    let incoming = [];
    let text = '有效牌按桌面可见信息估算。';
    let currentWaits = [];
    const recommendation = a.options.find(o => o.tile === selected ||
      (selected !== null && o.k === M.kind(selected) && M.isRed(o.tile) === M.isRed(selected))) ?? a.options[0];
    let analysisTiles = p.tiles;
    if (recommendation && !a.tsumo) {
      const discard = selected ?? recommendation.tile;
      analysisTiles = p.tiles.filter(t => t !== discard);
      distance = recommendation.distance;
      incoming = recommendation.incoming;
      text = '打出' + M.tileName(discard) + (distance === 0 ? '后听牌。' : '后，可摸到下列进张。');
    }
    if (distance === 0 && !a.tsumo) {
      currentWaits = M.waits(analysisTiles, p.melds);
      incoming = currentWaits.map(k => ({ k, left: 4 - a.visible[k] }));
      if (!recommendation) text = '已听牌，等待和牌张。';
    } else if (!recommendation && !a.tsumo && analysisTiles.length + p.melds.length * 3 === 13) {
      incoming = M.improvement(M.counts(analysisTiles), p.melds.length, distance, a.visible);
    }
    if (a.tsumo) {
      distance = -1;
      text = '可自摸 · 预计 ' + compact(a.tsumo.payout.total) + ' 点。';
    } else if (distance < 0) {
      text = game.t.phase === 'resolved' ? '本局已经结算。' : '牌型已齐，需要至少一个役。';
    }
    const furiten = p.temporaryFuriten || p.riichiFuriten || p.river.some(r => currentWaits.includes(M.kind(r.tile))) ||
      (selected !== null && currentWaits.includes(M.kind(selected)));
    let coach;
    if (furiten) coach = '<b>振听</b> · 此时可以自摸。';
    else if (game.t.guide && p.turns === 0) coach = '<b>首局引导</b> · 选中白板，再点「立直」。';
    else if (p.riichi && game.t.phase !== 'resolved') coach = '<b>已立直</b> · 可开启自动切牌，和牌时会停下。';
    else if (p.melds.some(m => m.open)) coach = '<b>副露后</b> · 留意役牌、断幺九等可用的役。';
    else coach = '<b>牌效提示</b> · 按提示查看推荐舍牌。';
    const count = incoming.reduce((sum, row) => sum + row.left, 0);
    $('advisor').innerHTML = '<div class="panel-body">' + header('牌局助手', 'compass', 'GUIDE') +
      '<div class="analysis-card"><div class="analysis-top"><strong' + (distance > 0 ? ' class="distance-tag"' : '') + '>' +
      (distance < 0 ? '牌型完成' : distance === 0 ? '听牌' : distance + ' 向听') +
      '</strong>' + (incoming.length ? '<small>约 ' + count + ' 张</small>' : '') + '</div><p class="analysis-text">' +
      text + '</p>' + (incoming.length ? '<div class="wait-list">' + incoming.slice(0, 8).map(row =>
        '<span class="wait-entry" aria-label="' + M.tileName(row.k * 4 + 1) + '，约剩 ' + row.left + ' 张">' +
        tile(row.k * 4 + 1) + row.left + '</span>').join('') +
        (incoming.length > 8 ? '<span class="wait-entry">+' + (incoming.length - 8) + ' 种</span>' : '') + '</div>' : '') +
      '</div><div class="coach-note">' + icon('hint') + '<span>' + coach + '</span></div></div>';
  }

  const help = {
    play: '<h3>摸牌、打牌与和牌</h3><ul><li>你与三名 AI 同桌。点一下手牌选中，再点同一张或点「打出」确认。</li>' +
      '<li>门前听牌时可缴 1,000 点宣告立直。符合和牌条件时，点「自摸」或「荣和」。<strong>至少需要一个役</strong>，单有宝牌无法和牌。</li>' +
      '<li>可选择吃、碰、明杠、暗杠或加杠。对手同时可荣和时，以舍牌者下家起的顺序头跳。振听只能自摸。</li>' +
      '<li>首局固定部分起手牌和牌序用于引导。后续从洗好的牌山中发牌，优先使用适合闯关的起手牌。</li></ul>' +
      '<h3>无尽挑战</h3><ul><li>你的和牌分计入本层目标，对手和牌或流局扣 1 命。每层可打多手，余命耗尽时挑战结束。</li>' +
      '<li>达标后回复 1 命，三选一拿遗物。遗物效果可以叠加，每层目标增加约 42%。进入新层时各家持点重置为 25,000。</li>' +
      '<li>此单人桌采用赤宝牌、食断与头跳，省略中途流局、流局满贯和包牌。进度与纪录保存在当前浏览器。</li></ul>',
    scoring: '<h3>青天井计分</h3><p class="formula">基础点 = 符 × 2<sup>翻 + 2</sup></p>' +
      '<ul><li>闲家荣和取基础点的 4 倍，庄家荣和取 6 倍。闲家自摸时庄家付 2 倍，另外两家各付 1 倍。庄家自摸则三家各付 2 倍。每笔向上取整到百点。</li>' +
      '<li>例如闲家 30 符 5 翻荣和是 15,400 点。翻数继续增加时照公式计算，满贯以上也照常翻倍。</li>' +
      '<li>每倍役满计 13 翻，复合役满累加。役满手另计宝牌与遗物，普通役与役满分开计算。国士无双按 30 符计算。</li>' +
      '<li>遗物可加翻或加符。本场棒和立直棒计入桌上支付，闯关分取和牌本身的分数。</li></ul>' +
      '<div class="help-links"><a href="https://www.worldriichi.org/wrc-rules" target="_blank" rel="noopener noreferrer">立直麻将规则</a>' +
      '<a href="https://p.eagate.573.jp/game/mfc/ac/event/aotenjo/2026/rule_san.html" target="_blank" rel="noopener noreferrer">青天井玩法参考</a></div>'
  };

  const mandatory = ['result', 'reward', 'over'];
  function modalTitle(kicker, title) {
    return '<div class="modal-heading"><div><div class="eyebrow"><span></span>' + kicker +
      '</div><h2 id="modal-title">' + title + '</h2></div>' + (!mandatory.includes(overlay) ?
      '<button type="button" class="icon-button" data-action="close" aria-label="关闭">' + icon('x') + '</button>' : '') + '</div>';
  }

  function resultHTML() {
    const r = game.t.result;
    const s = game.s;
    const won = r.winner === 0;
    const title = r.type === 'draw' ? '荒牌流局' : (won ? '你' : NAMES[r.winner]) + (r.method === 'tsumo' ? '自摸' : '荣和');
    let content = modalTitle(r.clear ? 'FLOOR CLEARED' : 'HAND RESULT', title);
    if (r.type === 'win') {
      const split = r.method === 'ron' ? '荣和 · ' + NAMES[r.from] + '支付 ' + fmt(r.payments.ron) :
        (game.t.dealer === r.winner ? '自摸 · 三家各付 ' + fmt(r.payments.childShare) :
          '自摸 · 庄家付 ' + fmt(r.payments.dealerShare) + '，两位闲家各付 ' + fmt(r.payments.childShare));
      content += '<div class="summary-banner"><div><b>' + fmt(r.score) + '</b><small>' +
        (won ? '和牌分 · 本层累计 ' + fmt(s.progress) : '对手和牌分') + '</small></div><strong>' + r.fu + ' 符 · ' +
        r.han + ' 翻</strong></div><div class="result-hand" aria-label="和牌牌型">' +
        r.tiles.map(id => tile(id)).join('') + tile(r.winning, 'result-win') + r.melds.map(meld).join('') + '</div>' +
        '<ul class="result-list">' + r.details.map(row => '<li class="type-' + row.category + '"><span>' + row.name +
          '</span><span>+' + (row.fu ? row.fu + ' 符' : row.han + ' 翻') + '</span></li>').join('') + '</ul>' +
        '<details class="score-details"><summary>查看点数分摊</summary><p>基础点 ' + fmt(r.basic) + ' · ' + split +
        '。</p><p>含本场棒与立直棒的实际收入为 ' + fmt(r.actual) + ' 点。</p><div class="dora-result">宝牌指示 ' +
        r.indicators.map(id => tile(id)).join('') + (r.ura.length ? '　里宝牌指示 ' + r.ura.map(id => tile(id)).join('') : '') +
        '</div></details>';
    } else {
      content += '<ul class="result-list">' + r.tenpai.map((ready, i) =>
        '<li><span>' + NAMES[i] + ' · ' + (ready ? '听牌' : '未听') + '</span><span>' + sign(r.deltas[i]) +
        ' 点</span></li>').join('') + '</ul>';
    }
    if (r.clear) content += '<p>本层达标。回复 1 命，并挑选一件遗物。</p>';
    else if (!won) content += '<p>失去 1 命，剩余 ' + s.hearts + ' 命。</p>';
    return content + '<div class="modal-actions">' +
      button(s.hearts === 0 ? '查看战绩' : r.clear ? '挑选遗物' : '下一局', 'next', { type: 'primary', glyph: 'arrow' }) + '</div>';
  }

  function rewardHTML() {
    return modalTitle('FLOOR ' + pad(game.s.floor) + ' / CLEARED', '选择一件遗物') +
      '<p>遗物会伴随这次挑战，并可叠加。选定后进入第 ' + (game.s.floor + 1) + ' 层。</p>' +
      '<div class="reward-choices">' + game.s.rewards.map(id => {
        const r = relicFor(id);
        return '<button type="button" class="reward-card" data-action="relic" data-option="' + id +
          '"><span class="relic-icon">' + icon(r.glyph) + '</span><em>' + r.label + '</em><b>' + r.name +
          '</b><small>' + r.effect + '</small></button>';
      }).join('') + '</div>';
  }

  function recordCards(rows) {
    return '<div class="records-grid">' + rows.map(([label, value]) => '<div class="record-card"><b>' +
      fmt(value) + '</b><small>' + label + '</small></div>').join('') + '</div>';
  }

  function renderModal() {
    let html;
    switch (overlay) {
      case 'result': html = resultHTML(); break;
      case 'reward': html = rewardHTML(); break;
      case 'over':
        html = modalTitle('RUN ENDED', '挑战结束') + '<p>你打了 ' + game.s.hands + ' 局，和牌 ' + game.s.wins +
          ' 次。可以从初席再次挑战。</p>' + recordCards([
          ['到达层数', game.s.floor], ['累计和牌分', game.s.total], ['最高单手', game.s.highest]
        ]) + '<div class="modal-actions">' + button('再开一局', 'reset', { type: 'primary', glyph: 'restart' }) + '</div>';
        break;
      case 'help':
        html = modalTitle('HANDBOOK', '玩法与计分') + '<div class="help-tabs">' +
          [['play', '怎么玩'], ['scoring', '青天井']].map(([id, label]) => button(label, 'help-tab', {
            type: helpTab === id ? 'primary' : '', attr: 'data-option="' + id + '" aria-pressed="' + (helpTab === id) + '"'
          })).join('') + '</div><div class="help-body">' + help[helpTab] + '</div>';
        break;
      case 'records':
        html = modalTitle('PERSONAL BEST', '我的纪录') + recordCards([
          ['最高层数', records.floor], ['最高单手', records.single], ['最高总分', records.total]
        ]) + '<p>最多通关 ' + records.cleared + ' 层，纪录保存在本机浏览器。</p>';
        break;
      case 'log':
        html = modalTitle('TABLE LOG', '对局记录') + '<ul class="log-list">' + game.s.events.map(e =>
          '<li class="' + e.type + '">' + icon(e.type === 'win' ? 'trophy' : e.type === 'warn' ? 'info' : 'history') +
          '<span>' + e.message + '</span></li>').join('') + '</ul>';
        break;
      case 'restart':
        html = modalTitle('NEW RUN', '重新挑战？') + '<p>当前进度会重置，历史纪录会保留。</p>' +
          '<div class="modal-actions">' + button('返回牌局', 'close') +
          button('从初席开始', 'reset', { type: 'primary', glyph: 'restart' }) + '</div>';
        break;
      default: return;
    }
    $('modal-content').innerHTML = html;
    const dialog = $('modal');
    if (!dialog.open) {
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else {
        dialog.classList.add('fallback');
        dialog.setAttribute('open', '');
      }
    }
    dialog.scrollTop = 0;
  }

  function hideModal() {
    const dialog = $('modal');
    if (typeof dialog.close === 'function' && dialog.open) dialog.close();
    else dialog.removeAttribute('open');
  }

  function show(type) {
    overlay = type;
    renderModal();
    queueTurn();
  }

  function close() {
    if (mandatory.includes(overlay)) return;
    overlay = null;
    hideModal();
    queueTurn();
  }

  function queueTurn() {
    clearTimeout(aiTimer);
    if (overlay || game.s.view !== 'play' || game.t.phase !== 'turn') return;
    if (game.t.turn !== 0) {
      aiTimer = setTimeout(() => move(() => game.botTurn(), false), 210);
    } else if (game.you.riichi && prefs.auto && !analysis().tsumo && !analysis().kans.length) {
      aiTimer = setTimeout(() => move(() => game.discard(0, game.you.drawn), false), 410);
    }
  }

  function render() {
    analysisMemo = null;
    renderNav();
    renderRun();
    renderTable();
    renderConsole();
    renderAdvisor();
    if (game.s.view !== 'play') {
      overlay = game.s.view;
      renderModal();
    } else if (mandatory.includes(overlay)) {
      overlay = null;
      hideModal();
    }
    queueTurn();
  }

  function move(action, sound = 'click') {
    if (!action()) return;
    selected = null;
    riichiMode = false;
    highlight = false;
    kanMode = false;
    if (game.s.view === 'result' && game.t.result.winner === 0) playSound('win');
    else if (sound) playSound(sound);
    updateStorage();
    render();
  }

  function repaint(keepFocus = false) {
    renderConsole(keepFocus);
    renderAdvisor();
  }

  function discardSelected() {
    const id = selected ?? (game.you.riichi ? game.you.drawn : null);
    if (id !== null) move(() => game.discard(0, id, riichiMode), riichiMode ? 'call' : 'click');
  }

  function clickTile(id, keyboard) {
    if (!analysis().ownTurn || (riichiMode ? !analysis().riichi.includes(id) : !analysis().legal.includes(id))) return;
    if (id === selected) discardSelected();
    else {
      selected = id;
      kanMode = false;
      repaint(keyboard);
    }
  }

  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  document.addEventListener('click', e => {
    const el = e.target.closest('button[data-action]');
    if (!el || el.disabled) return;
    const action = el.dataset.action;
    switch (action) {
      case 'tile': clickTile(Number(el.dataset.tile), e.detail === 0); break;
      case 'discard': discardSelected(); break;
      case 'riichi':
        if (riichiMode) {
          riichiMode = false;
        } else if (analysis().riichi.includes(selected)) {
          move(() => game.discard(0, selected, true), 'call');
          break;
        } else {
          riichiMode = true;
          kanMode = false;
          selected = analysis().riichi.length === 1 ? analysis().riichi[0] : null;
        }
        repaint();
        break;
      case 'tsumo': move(() => game.tsumo(0)); break;
      case 'react': move(() => game.respond(el.dataset.option), 'call'); break;
      case 'pass': move(() => game.respond('pass'), false); break;
      case 'show-kan':
        kanMode = !kanMode;
        repaint();
        break;
      case 'kan': move(() => game.declareKan(0, el.dataset.option), 'call'); break;
      case 'next': move(() => game.continueResult(), false); break;
      case 'relic': move(() => game.chooseRelic(el.dataset.option), 'call'); break;
      case 'hint':
        highlight = !highlight;
        repaint();
        if (highlight && analysis().options[0]) note('推荐打出' + M.tileName(analysis().options[0].tile));
        break;
      case 'auto':
        prefs.auto = !prefs.auto;
        save('prefs', prefs);
        repaint();
        queueTurn();
        break;
      case 'sound':
        prefs.sound = !prefs.sound;
        save('prefs', prefs);
        renderNav();
        playSound('call');
        note(prefs.sound ? '音效开启' : '音效关闭');
        break;
      case 'rules': helpTab = 'play'; show('help'); break;
      case 'scoring': helpTab = 'scoring'; show('help'); break;
      case 'help-tab': helpTab = el.dataset.option; renderModal(); break;
      case 'log': show('log'); break;
      case 'records': show('records'); break;
      case 'restart': show('restart'); break;
      case 'close': close(); break;
      case 'reset':
        overlay = null;
        hideModal();
        game = new Game();
        move(() => true, false);
        break;
    }
  });

  $('modal').addEventListener('cancel', e => { e.preventDefault(); close(); });
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) close(); });
  document.addEventListener('keydown', e => {
    if (overlay || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && (selected !== null || riichiMode || kanMode)) {
      selected = null;
      riichiMode = false;
      kanMode = false;
      repaint();
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && e.target.matches?.('button.tile')) {
      const buttons = [...$('hand-ui').querySelectorAll('button.tile:not(:disabled)')];
      const index = buttons.indexOf(e.target);
      buttons[index + (e.key === 'ArrowLeft' ? -1 : 1)]?.focus();
      e.preventDefault();
    }
  });
  updateStorage();
  render();
})();

</script>
</body>
</html>
