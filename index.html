<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101511">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="青天井单人拼牌。每关从20张候选牌里选14张，按青天井计分，单手达标即可过关。">
  <title>青天井 · 单人拼牌</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23d2ec83'/%3E%3Cpath d='M24 7 41 24 24 41 7 24Z M16 24h16M24 16v16' fill='none' stroke='%231c2b17' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
:root {
  --ink: #101511;
  --panel: #1b251d;
  --line: #364837;
  --text: #f0f1e6;
  --muted: #aebca9;
  --lime: #d3ed85;
  --amber: #ecc48a;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  font-family: var(--sans);
  color: var(--text);
  background: var(--ink);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-width: 300px; min-height: 100vh; min-height: 100dvh;
  background: radial-gradient(ellipse at 50% -22%, #23362a, #141c15 52%, var(--ink) 86%);
}
button { color: inherit; font: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
.ico { display: inline-block; width: 1em; height: 1em; flex-shrink: 0; vertical-align: -.13em; }
[data-icon] { display: inline-flex; }
.shell {
  width: min(864px, 100%); margin-inline: auto;
  padding-left: max(18px, env(safe-area-inset-left));
  padding-right: max(18px, env(safe-area-inset-right));
}
.site-header { background: #111a13; border-bottom: 1px solid #2d3e2e; padding-top: env(safe-area-inset-top, 0px); }
.nav { min-height: 62px; display: flex; align-items: center; gap: 10px; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto;
  color: #22331c; background: var(--lime); box-shadow: inset 0 1px 0 #ffffff55;
}
.brand-mark .ico { width: 23px; height: 23px; }
.nav h1 { margin: 0; font-size: 20px; letter-spacing: .055em; white-space: nowrap; }
.mode { padding-left: 9px; border-left: 1px solid #485a48; color: var(--muted); font-size: 12px; white-space: nowrap; }
.rules-button { margin-left: auto; }
.main { padding-top: 18px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }

.statusbar {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; overflow: hidden;
  margin-bottom: 11px; background: #3a4c3b; border: 1px solid var(--line); border-radius: 11px;
}
.metric { min-width: 0; display: grid; gap: 4px; padding: 10px 12px; background: #212e22; }
.metric > span:first-child { font-size: 11px; color: var(--muted); }
.metric b { white-space: nowrap; font: 750 clamp(16px, 3.2vw, 25px)/1.08 var(--mono); }
.metric.target b, .metric.met b { color: var(--lime); }
.hearts { display: flex; align-items: center; gap: 4px; font-size: 15px; color: #596e55; min-height: 20px; }
.hearts .full { color: var(--amber); }

.board { overflow: hidden; border: 1px solid #435b44; border-radius: 13px; box-shadow: 0 12px 40px #0003; }
.hand-zone, .pool-zone { padding: 14px 17px; }
.hand-zone {
  background: radial-gradient(ellipse at 50% 42%, #255341, #153b2e 82%);
  border-bottom: 1px solid #497056;
}
.pool-zone { background: #1b281d; }
.zone-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 23px; margin-bottom: 9px; }
.zone-header h2 { display: inline-flex; gap: 7px; align-items: baseline; margin: 0; font-size: 14px; letter-spacing: .035em; }
.zone-header h2 small { color: var(--muted); font: 11px var(--mono); }
.hand-count { color: #e2f4c2; font: 700 13px var(--mono); white-space: nowrap; }
.dora { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); font-size: 11px; white-space: nowrap; }
.dora .tile { width: 20px; --tile-edge: 2px; }
.dora strong { color: #e3eddd; font-size: 10px; font-weight: 600; }
.tile-grid { display: grid; gap: 5px; align-items: end; justify-items: center; margin-inline: auto; }
.tray-grid { grid-template-columns: repeat(14, minmax(0, 1fr)); max-width: 728px; }
.pool-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); max-width: 605px; }
.tile, .slot {
  --tile-edge: 4px;
  position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  aspect-ratio: 3 / 4.2; border: 1px solid #ddd6bb; border-radius: 11%; vertical-align: middle;
}
.tile {
  padding: 0 0 var(--tile-edge); background: linear-gradient(148deg, #fffcf0 0%, #f4efdb 62%, #e8e1ca 100%);
  box-shadow: inset 0 calc(-1 * var(--tile-edge)) #b2bda0, 0 2px 3px #030b0855;
  color: #24372d; user-select: none; -webkit-user-select: none;
}
.tile svg { display: block; width: 100%; height: 100%; overflow: visible; }
.tile-grid .tile, .tile-grid .slot { width: 100%; }
.tray-grid .tile, .tray-grid .slot { max-width: 46px; }
.pool-grid .tile { max-width: 54px; }
.slot { border-color: #a7cca24d; border-style: dashed; background: #11322659; }
.slot::before {
  content: ""; width: 14%; aspect-ratio: 1; rotate: 45deg;
  border: 1px solid #9ec69a62; border-radius: 1px;
}
.tile-grid button.tile:not(:disabled):hover { filter: brightness(1.08); }
.tile-grid button.tile:disabled { filter: saturate(.72) brightness(.85); }
.pool-grid .selected-pool {
  background: linear-gradient(145deg, #a1ae84, #758967); border-color: #a8b893;
  box-shadow: inset 0 calc(-1 * var(--tile-edge)) #586d52;
}
.pool-grid .selected-pool svg { opacity: .52; }
.pool-grid .selected-pool::after {
  content: "✓"; display: grid; place-items: center; position: absolute; top: 1px; right: 1px;
  background: #334c2d; border-radius: 4px; width: 14px; height: 14px; color: #eef7d5; font-size: 11px; font-weight: 750;
}
.tile.new-draw { border-color: #b98b53; box-shadow: inset 0 calc(-1 * var(--tile-edge)) #c0a775, 0 0 0 1px #d6ae6da0; }
.tile.is-out, .tile.hint-choose { outline: 2px solid var(--lime); outline-offset: 1px; }
.tile.hint-return { outline: 2px solid var(--amber); outline-offset: 1px; }
.feedback {
  min-height: 20px; margin: 9px 0 0; display: flex; align-items: center; justify-content: space-between;
  gap: 5px 9px; flex-wrap: wrap; color: #d2e4cf; font-size: 12px; line-height: 1.45;
}
.feedback strong { color: var(--lime); }
.yaku-labels { display: block; color: #e5f2cd; }
.score-total { display: block; margin-top: 3px; }
.feedback .short { color: var(--amber); }
.feedback button, .utility button {
  border: 0; background: transparent; color: var(--muted); font-size: 12px; white-space: nowrap; padding: 4px 0;
}
.feedback button { color: #e5efda; text-decoration: underline; text-underline-offset: .24em; }
.feedback button:hover, .utility button:hover { color: var(--lime); }

.board-controls {
  display: flex; gap: 7px; justify-content: flex-end; flex-wrap: wrap; padding: 10px 12px;
  border-top: 1px solid #364a37; background: #212e23;
}
.action-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px;
  background: #2c3d2e; border: 1px solid #4a6249; border-radius: 7px;
  color: #e0eadd; padding: 0 12px; font-size: 12px; font-weight: 700; white-space: nowrap;
}
.action-btn .ico { font-size: 15px; }
.action-btn:hover:not(:disabled), .action-btn[aria-pressed="true"] { background: #3e5438; border-color: #a0b980; }
.action-btn:disabled { opacity: .58; }
.action-btn.primary { background: var(--lime); border-color: var(--lime); color: #20321a; box-shadow: inset 0 1px #ffffff50; }
.action-btn.primary:hover:not(:disabled) { background: #e3f8a3; }
.action-btn.quiet { background: transparent; border-color: #3c513f; }
.action-btn small { font: 700 10px var(--mono); color: #c7d7bb; }
.utility { display: flex; justify-content: space-between; gap: 8px; padding: 0 2px; min-height: 40px; }
.utility button { min-height: 40px; display: inline-flex; gap: 6px; align-items: center; }
.utility button:last-child { margin-left: auto; }

dialog {
  width: min(565px, calc(100% - 22px)); max-height: 88vh; max-height: 88dvh;
  margin: auto; padding: 0; border: 1px solid #577150; border-radius: 14px; overflow: auto;
  color: var(--text); background: #1b281e; box-shadow: 0 20px 80px #0008;
}
dialog:not([open]) { display: none; }
dialog::backdrop { background: #09120dc9; backdrop-filter: blur(3px); }
dialog.fallback[open] { position: fixed; inset: 0; z-index: 6; height: fit-content; box-shadow: 0 0 0 100vmax #09120de8; }
.modal-content { padding: 15px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
.modal-header h2 { margin: 0; font-size: clamp(20px, 4.8vw, 26px); }
.modal-header button { padding-inline: 10px; }
.modal-content p, .modal-content li { color: #cad8c7; font-size: 13px; line-height: 1.55; }
.modal-content p { margin: 8px 0 11px; }
.modal-content ul { margin: 8px 0 12px; padding-left: 18px; }
.modal-content li + li { margin-top: 4px; }
.modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; margin-top: 12px; }
.result-score {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px;
  padding: 10px; background: #30442a; border: 1px solid #587047; border-radius: 8px;
}
.result-score b { color: var(--lime); font: 750 clamp(21px, 4.6vw, 32px) var(--mono); overflow-wrap: anywhere; }
.result-score span { color: #dee9d7; font-size: 12px; }
.score-list { display: grid; margin: 5px 0 0; }
.score-list div { display: flex; justify-content: space-between; gap: 5px; padding: 5px 0; border-bottom: 1px solid #3b503d; font-size: 12px; }
.score-list dd { margin: 0; white-space: nowrap; }
.score-list .type-relic, .score-list .type-stage { color: var(--amber); }
.score-list .type-dora { color: #c8e09c; }
.wallet { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; font-size: 13px; color: var(--muted); }
.wallet b { color: var(--amber); }
.shop-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
.shop-tabs .action-btn { flex: 1; }
.shop-product {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid #3b503d;
}
.shop-product b, .build-row b { font-size: 13px; }
.shop-product small, .build-row small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.4; }
.shop-refresh { display: flex; justify-content: flex-start; padding-top: 7px; }
.upgrade-label { display: block; padding: 5px 0; font-size: 12px; color: var(--muted); }
#upgrade-select {
  width: 100%; min-height: 44px; padding: 5px 8px; color: var(--text); background: #263829;
  border: 1px solid #577150; border-radius: 7px; font: 16px var(--sans);
}
.upgrade-product { margin-top: 5px; }
.deck-grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.deck-card { display: grid; justify-items: center; gap: 2px; min-width: 0; min-height: 44px; padding: 3px;
  border: 1px solid var(--line); border-radius: 5px; background: #243427; }
.removal-picks { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.deck-card:disabled { opacity: .65; }
.deck-card[aria-pressed="true"] { border-color: var(--lime); background: #3e5438; }
.deck-card .tile { width: min(100%, 29px); --tile-edge: 2px; }
.deck-card > span:last-child { color: var(--muted); font: 10px var(--mono); }
@media (max-width: 420px) { .deck-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
.build-row { border-bottom: 1px solid #3b503d; padding: 6px 0; }
.toast {
  position: fixed; z-index: 5; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); translate: -50% 0;
  max-width: calc(100% - 22px); width: max-content; padding: 7px 10px; border: 1px solid #68845b; border-radius: 7px;
  color: var(--text); background: #263627; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .15s ease;
}
.toast.visible { opacity: 1; }

@media (max-width: 620px) {
  .shell { padding-left: max(9px, env(safe-area-inset-left)); padding-right: max(9px, env(safe-area-inset-right)); }
  .nav { min-height: 52px; gap: 7px; }
  .brand-mark { width: 30px; height: 30px; }
  .brand-mark .ico { width: 21px; height: 21px; }
  .nav h1 { font-size: 17px; }
  .mode { padding-left: 6px; font-size: 11px; }
  .main { padding-top: 9px; }
  .statusbar { margin-bottom: 7px; border-radius: 8px; }
  .metric { padding: 6px 7px; gap: 3px; }
  .metric b { font-size: clamp(14px, 4.2vw, 20px); }
  .metric > span:first-child { font-size: 10px; }
  .hearts { gap: 3px; font-size: 13px; min-height: 18px; }
  .board { border-radius: 9px; }
  .hand-zone, .pool-zone { padding: 9px 8px; }
  .zone-header { margin-bottom: 6px; }
  .zone-header h2 { font-size: 13px; }
  .tile-grid { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 422px; }
  .tile-grid .tile, .tile-grid .slot { --tile-edge: 3px; max-width: 54px; }
  .feedback { margin-top: 7px; font-size: 11px; }
  .feedback button { font-size: 11px; min-height: 28px; }
  .board-controls { gap: 4px; padding: 7px; justify-content: space-between; }
  .board-controls .action-btn { padding-inline: 6px; flex: 1 0 auto; }
  .board-controls .action-btn .ico { font-size: 13px; }
  .utility button { font-size: 11px; }
  .modal-content { padding: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .001ms !important; }
}

</style>
</head>
<body>
  <header class="site-header">
    <div class="shell nav">
      <span class="brand-mark" data-icon="logo"></span>
      <h1>青天井</h1>
      <span class="mode">单人拼牌</span>
      <button type="button" class="action-btn quiet rules-button" data-action="rules"><span data-icon="book"></span>规则</button>
    </div>
  </header>
  <main class="shell main">
    <section class="statusbar" id="statusbar" aria-label="闯关进度"></section>
    <section class="board" aria-label="单人拼牌牌桌">
      <section class="hand-zone" id="hand-zone" aria-label="和牌区"></section>
      <section class="pool-zone" id="pool-zone" aria-label="候选牌"></section>
      <div class="board-controls" id="controls"></div>
    </section>
    <div class="utility" id="utility"></div>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-content" id="modal-content"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
/* Tile IDs refer to physical copies. Tile kinds run 1m–9m, 1p–9p, 1s–9s, E S W N P F C. */
const Mahjong = (() => {
  const KINDS = Array.from({ length: 34 }, (_, i) => i);
  const WINDS = ['东', '南', '西', '北'];
  const HONORS = [...WINDS, '白', '发', '中'];
  const DIGITS = '一二三四五六七八九';
  const TERMINALS = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
  const GREEN = new Set([19, 20, 21, 23, 25, 32]);
  const RED_FIVES = new Set([4, 13, 22]);
  const kind = tile => Math.floor(tile / 4);
  const suit = k => Math.floor(k / 9);
  const rank = k => k % 9;
  const honor = k => k >= 27;
  const outside = k => honor(k) || rank(k) === 0 || rank(k) === 8;
  const isRed = tile => tile % 4 === 0 && RED_FIVES.has(kind(tile));
  const tileName = tile => {
    const k = kind(tile);
    return honor(k) ? (k === 31 ? '白板' : HONORS[k - 27]) :
      (isRed(tile) ? '赤' : '') + DIGITS[rank(k)] + '万筒索'[suit(k)];
  };
  const byTile = (a, b) => a - b;
  const counts = tiles => {
    const c = Array(34).fill(0);
    for (const tile of tiles) c[kind(tile)]++;
    return c;
  };
  const doraKind = k => k < 27 ? suit(k) * 9 + (rank(k) + 1) % 9 :
    k < 31 ? 27 + (k - 26) % 4 : 31 + (k - 30) % 3;

  // Cache Pareto-optimal combinations of sets, incomplete sets and a head per suit.
  const profileCache = [new Map(), new Map()];
  function profiles(block, suited) {
    const cache = profileCache[Number(suited)];
    const code = block.reduceRight((value, n) => value * 5 + n, 0);
    if (cache.has(code)) return cache.get(code);
    if (code === 0) return [[0, 0, 0]];
    const i = block.findIndex(n => n);
    const best = new Map();
    function take(indices, sets, partials, head) {
      for (const j of indices) block[j]--;
      for (const [m, t, p] of profiles(block, suited)) {
        if (p + head > 1) continue;
        const key = (m + sets) * 2 + p + head;
        best.set(key, Math.max(best.get(key) ?? -1, t + partials));
      }
      for (const j of indices) block[j]++;
    }
    take([i], 0, 0, 0);
    if (block[i] >= 2) {
      take([i, i], 0, 1, 0);
      take([i, i], 0, 0, 1);
    }
    if (block[i] >= 3) take([i, i, i], 1, 0, 0);
    if (suited) {
      if (block[i + 1]) take([i, i + 1], 0, 1, 0);
      if (block[i + 2]) take([i, i + 2], 0, 1, 0);
      if (block[i + 1] && block[i + 2]) take([i, i + 1, i + 2], 1, 0, 0);
    }
    const result = [...best].map(([key, t]) => [key >> 1, t, key & 1]);
    if (cache.size > 35000) cache.clear();
    cache.set(code, result);
    return result;
  }

  function shantenCounts(c, openSets = 0) {
    let result = 8;
    if (!openSets) {
      const unique = c.filter(n => n > 0).length;
      const pairs = c.filter(n => n >= 2).length;
      const distinctOrphans = TERMINALS.filter(k => c[k]).length;
      result = Math.min(6 - pairs + Math.max(0, 7 - unique),
        13 - distinctOrphans - Number(TERMINALS.some(k => c[k] >= 2)));
    }
    const blocks = [0, 9, 18, 27].map(start => profiles(c.slice(start, start + 9), start < 27));
    function combine(i, sets, partials, head) {
      if (i === 4) {
        result = Math.min(result, 8 - sets * 2 - Math.min(partials, 4 - sets) - head);
        return;
      }
      for (const [m, t, p] of blocks[i]) {
        if (sets + m <= 4 && head + p <= 1) combine(i + 1, sets + m, partials + t, head + p);
      }
    }
    combine(0, openSets, 0, 0);
    return result;
  }

  const shanten = (tiles, melds = []) => shantenCounts(counts(tiles), melds.length);
  function shapes(c, setsNeeded) {
    const result = [];
    if (setsNeeded === 4 && c.filter(n => n === 2).length === 7) result.push({ form: 'pairs' });
    if (setsNeeded === 4 && TERMINALS.every(k => c[k]) &&
        TERMINALS.reduce((sum, k) => sum + c[k], 0) === 14) result.push({ form: 'orphans' });
    const sets = [];
    function scan(from, left, head) {
      let k = from;
      while (k < 34 && !c[k]) k++;
      if (k === 34) {
        if (!left) result.push({ form: 'standard', head, sets: sets.slice() });
        return;
      }
      if (!left) return;
      if (c[k] >= 3) {
        c[k] -= 3;
        sets.push({ type: 'pon', k, open: false });
        scan(k, left - 1, head);
        sets.pop();
        c[k] += 3;
      }
      if (!honor(k) && rank(k) < 7 && c[k + 1] && c[k + 2]) {
        c[k]--; c[k + 1]--; c[k + 2]--;
        sets.push({ type: 'chi', k, open: false });
        scan(k, left - 1, head);
        sets.pop();
        c[k]++; c[k + 1]++; c[k + 2]++;
      }
    }
    for (const k of KINDS) {
      if (c[k] < 2) continue;
      c[k] -= 2;
      scan(0, setsNeeded, k);
      c[k] += 2;
    }
    return result;
  }

  function waits(tiles, melds = []) {
    const c = counts(tiles);
    if (tiles.length + melds.length * 3 !== 13 || shantenCounts(c, melds.length) !== 0) return [];
    const own = counts(tiles.concat(melds.flatMap(m => m.tiles)));
    return KINDS.filter(k => {
      if (own[k] === 4) return false;
      c[k]++;
      const valid = shapes(c, 4 - melds.length).length > 0;
      c[k]--;
      return valid;
    });
  }

  function payments(fu, han, dealer, tsumo) {
    const basic = BigInt(fu) << BigInt(han + 2);
    const round = n => (n + 99n) / 100n * 100n;
    if (!tsumo) {
      const ron = round(basic * (dealer ? 6n : 4n));
      return { basic, ron, total: ron };
    }
    const dealerShare = round(basic * 2n);
    const childShare = dealer ? dealerShare : round(basic);
    return { basic, dealerShare, childShare, total: dealer ? childShare * 3n : dealerShare + childShare * 2n };
  }

  function score({ tiles, melds = [], winning, tsumo = false, seat = 27, round = 27,
    riichi = 0, ippatsu = false, last = false, rinshan = false, chankan = false,
    blessing = false, indicators = [], ura = [], relics = [], bonusHan = 0, shopBonus = null }) {
    if (tiles.length + melds.length * 3 !== 14) return null;
    const c = counts(tiles);
    const patterns = shapes(c, 4 - melds.length);
    if (!patterns.length) return null;
    const allTiles = tiles.concat(melds.flatMap(m => m.tiles));
    const kinds = allTiles.map(kind);
    const all = counts(allTiles);
    const kWin = kind(winning);
    const closed = melds.every(m => !m.open);
    const fixedSets = melds.map(m => ({ type: m.type, open: m.open, k: Math.min(...m.tiles.map(kind)) }));
    const dora = indicators.reduce((sum, t) => sum + all[doraKind(kind(t))], 0);
    const red = allTiles.filter(isRed).length;
    const hidden = riichi ? ura.reduce((sum, t) => sum + all[doraKind(kind(t))], 0) : 0;
    const suitCount = new Set(kinds.filter(k => !honor(k)).map(suit)).size;
    const hasHonors = kinds.some(honor);
    const allOutside = kinds.every(outside);
    const simple = !kinds.some(outside);
    const dragons = [31, 32, 33];
    let best = null;

    function evaluate(pattern, position) {
      const standard = pattern.form === 'standard';
      const pairs = pattern.form === 'pairs';
      const orphans = pattern.form === 'orphans';
      const groups = standard ? [...pattern.sets, ...fixedSets] : [];
      const triplets = groups.filter(g => g.type !== 'chi');
      const sequences = groups.filter(g => g.type === 'chi');
      const kanCount = triplets.filter(g => g.type === 'kan').length;
      const isConcealed = g => !g.open && (tsumo || g !== pattern.sets?.[position]);
      const concealed = triplets.filter(isConcealed).length;
      const head = pattern.head;
      const tripletKinds = new Set(triplets.map(g => g.k));
      const dragonSets = dragons.filter(k => tripletKinds.has(k)).length;
      const windSets = [27, 28, 29, 30].filter(k => tripletKinds.has(k)).length;
      const pairFu = standard ? 2 * (Number(head === seat) + Number(head === round) + Number(dragons.includes(head))) : 0;
      const waitGroup = pattern.sets?.[position];
      const waitFu = position === -1 || (waitGroup?.type === 'chi' &&
        (kWin === waitGroup.k + 1 ||
        (rank(waitGroup.k) === 0 && kWin === waitGroup.k + 2) ||
        (rank(waitGroup.k) === 6 && kWin === waitGroup.k))) ? 2 : 0;
      const pinfu = standard && closed && sequences.length === 4 && pairFu === 0 && waitFu === 0;
      const yakuman = [];
      const yaku = [];
      const add = (name, han, id) => yaku.push({ name, han, id, category: 'yaku' });
      const limit = (name, multiple = 1) => yakuman.push({ name, han: 13 * multiple, category: 'yakuman' });
      if (blessing && tsumo) limit(seat === 27 ? '天和' : '地和');
      if (orphans) limit(c[kWin] === 2 ? '国士无双十三面' : '国士无双', c[kWin] === 2 ? 2 : 1);
      if (dragonSets === 3) limit('大三元');
      if (windSets === 4) limit('大四喜', 2);
      if (windSets === 3 && head >= 27 && head <= 30) limit('小四喜');
      if (concealed === 4) limit(position === -1 ? '四暗刻单骑' : '四暗刻', position === -1 ? 2 : 1);
      if (kanCount === 4) limit('四杠子');
      if (kinds.every(honor)) limit('字一色');
      if (!hasHonors && allOutside) limit('清老头');
      if (kinds.every(k => GREEN.has(k))) limit('绿一色');
      if (closed && !melds.length && suitCount === 1 && !hasHonors) {
        const start = suit(kWin) * 9;
        const nine = [3, 1, 1, 1, 1, 1, 1, 1, 3];
        if (nine.every((n, i) => all[start + i] >= n)) {
          const pure = nine.every((n, i) => all[start + i] - Number(start + i === kWin) === n);
          limit(pure ? '纯正九莲宝灯' : '九莲宝灯', pure ? 2 : 1);
        }
      }

      if (!yakuman.length) {
        if (riichi) add(riichi === 2 ? '两立直' : '立直', riichi, 'riichi');
        if (riichi && ippatsu) add('一发', 1);
        if (tsumo && closed) add('门前清自摸和', 1);
        if (last) add(tsumo ? '海底摸月' : '河底捞鱼', 1);
        if (rinshan) add('岭上开花', 1);
        if (chankan) add('抢杠', 1);
        if (simple) add('断幺九', 1, 'tanyao');
        if (suitCount === 1) add(hasHonors ? '混一色' : '清一色',
          hasHonors ? (closed ? 3 : 2) : (closed ? 6 : 5));
        if (allOutside) add('混老头', 2);
        if (pairs) add('七对子', 2);
        if (standard) {
          if (pinfu) add('平和', 1);
          if (triplets.length === 4) add('对对和', 2);
          if (concealed === 3) add('三暗刻', 2);
          if (kanCount === 3) add('三杠子', 2);
          if (dragonSets === 2 && dragons.includes(head)) add('小三元', 2);
          if (tripletKinds.has(seat)) add('自风・' + HONORS[seat - 27], 1);
          if (tripletKinds.has(round)) add('场风・' + HONORS[round - 27], 1);
          for (const k of dragons) if (tripletKinds.has(k)) add('役牌・' + HONORS[k - 27], 1);
          const seqCount = new Map();
          for (const g of sequences) seqCount.set(g.k, (seqCount.get(g.k) ?? 0) + 1);
          if (closed) {
            const duplicates = [...seqCount.values()].reduce((sum, n) => sum + Math.floor(n / 2), 0);
            if (duplicates) add(duplicates === 2 ? '二杯口' : '一杯口', duplicates === 2 ? 3 : 1);
          }
          if ([0, 1, 2, 3, 4, 5, 6].some(i => [i, i + 9, i + 18].every(k => seqCount.has(k))))
            add('三色同顺', closed ? 2 : 1);
          if ([0, 1, 2, 3, 4, 5, 6, 7, 8].some(i => [i, i + 9, i + 18].every(k => tripletKinds.has(k))))
            add('三色同刻', 2);
          if ([0, 9, 18].some(i => [i, i + 3, i + 6].every(k => seqCount.has(k))))
            add('一气通贯', closed ? 2 : 1);
          if (sequences.length && outside(head) &&
              triplets.every(g => outside(g.k)) && sequences.every(g => [0, 6].includes(rank(g.k)))) {
            add(hasHonors ? '混全带幺九' : '纯全带幺九', hasHonors ? (closed ? 2 : 1) : (closed ? 3 : 2));
          }
        }
      }

      const legal = yakuman.length ? yakuman : yaku;
      if (!legal.length) return; // Bonus han cannot supply the hand's first yaku.
      let fu = orphans ? 30 : pairs ? 25 : 20;
      if (standard && !(pinfu && tsumo)) {
        fu += pairFu + waitFu + (tsumo ? 2 : closed ? 10 : 0);
        for (const g of triplets) {
          fu += 2 * (outside(g.k) ? 2 : 1) * (isConcealed(g) ? 2 : 1) * (g.type === 'kan' ? 4 : 1);
        }
        fu = Math.max(30, Math.ceil(fu / 10) * 10);
      }
      const details = legal.slice();
      if (dora) details.push({ name: '宝牌', han: dora, category: 'dora' });
      if (red) details.push({ name: '赤宝牌', han: red, category: 'dora' });
      if (hidden) details.push({ name: '里宝牌', han: hidden, category: 'dora' });
      if (bonusHan) details.push({ name: '登阶加成', han: bonusHan, category: 'stage' });
      const baseFu = fu;
      for (const relic of relics) {
        if (relic.id === 'seal') {
          fu += 10;
          details.push({ name: relic.name, fu: 10, category: 'relic' });
          continue;
        }
        const triggered = {
          moon: tsumo, jade: simple, mirror: dora + red + hidden > 0,
          pair: pairs, dragon: dragonSets > 0, harmony: suitCount === 1
        };
        if (triggered[relic.id]) details.push({ name: relic.name, han: relic.han, category: 'relic' });
      }
      const multiplier = shopBonus?.(pattern.form, legal, details) ?? 1;
      const han = details.reduce((total, row) => total + (row.han ?? 0), 0) * multiplier;
      const payout = payments(fu, han, seat === 27, tsumo);
      if (!best || payout.total > best.payout.total ||
          (payout.total === best.payout.total && han > best.han)) {
        best = { han, fu, baseFu, details, payout, multiplier, form: pattern.form };
      }
    }

    for (const pattern of patterns) {
      if (pattern.form !== 'standard') {
        evaluate(pattern, -2);
        continue;
      }
      if (pattern.head === kWin) evaluate(pattern, -1);
      pattern.sets.forEach((g, i) => {
        if (g.type === 'chi' ? kWin >= g.k && kWin <= g.k + 2 : kWin === g.k) evaluate(pattern, i);
      });
    }
    return best;
  }

  return { KINDS, DIGITS, kind, suit, rank, honor, outside, isRed, byTile, tileName,
    counts, doraKind, shanten, waits, payments, score };
})();

  <script>
const Solo = (() => {
  const M = Mahjong;
  const POOL_SIZE = 20;
  const HAND_SIZE = 14;
  const MAX_HEARTS = 3;
  const BASE_DRAWS = 2;
  const MAX_DRAWS = 5;
  const FORMS = { standard: '四面子一雀头', pairs: '七对子', orphans: '国士无双' };
  const RELICS = [

    { id: 'heal', glyph: 'heart', name: '续命符', label: '余命', effect: '过关时再回复 1 命，上限 3。' }
  ];
  const upgrades = [
    ...Object.entries(FORMS).map(([id, name]) => ({ id, name, form: true })),
    ...['门前清自摸和', '断幺九', '平和', '一杯口', '二杯口', '对对和', '三暗刻', '三色同顺', '三色同刻',
      '一气通贯', '混全带幺九', '纯全带幺九', '混老头', '小三元', '混一色', '清一色',
      '自风・南', '场风・东', '役牌・白', '役牌・发', '役牌・中',
      '大三元', '大四喜', '小四喜', '四暗刻', '四暗刻单骑', '字一色', '清老头', '绿一色', '九莲宝灯', '纯正九莲宝灯']
      .map(name => ({ id: name, name, form: false }))
  ];
  const upgradeById = new Map(upgrades.map(row => [row.id, row]));
  const items = [
    { id: 'supply', name: '藏牌袖', price: 5, effect: '之后每关 +1 次补牌，最多 5 次。' },
    { id: 'jade', name: '断玉', price: 4, effect: '只含 2–8 的数牌时，+2 翻。',
      when: tiles => tiles.every(k => !M.outside(k)), han: 2 },
    { id: 'edge', name: '幺九印', price: 4, effect: '只含 1、9 和字牌时，+3 翻。',
      when: tiles => tiles.every(M.outside), han: 3 },
    { id: 'mirror', name: '宝鉴', price: 4, effect: '含宝牌或赤宝牌时，+2 翻。',
      when: (_tiles, rows) => rows.some(row => row.category === 'dora'), han: 2 },
    { id: 'clear', name: '清色灯', price: 7, effect: '只含一种数牌花色时，总翻数 ×2。',
      when: tiles => tiles[0] < 27 && tiles.every(k => M.suit(k) === M.suit(tiles[0])), multiplier: 2 },
    { id: 'pairs', name: '双生结', price: 6, effect: '以七对子和牌时，总翻数 ×2。',
      when: (_tiles, _rows, form) => form === 'pairs', multiplier: 2 },
    { id: 'ink', name: '无字卷', price: 4, effect: '手牌全是数牌时，+1 翻。',
      when: tiles => tiles.every(k => !M.honor(k)), han: 1 },
    { id: 'three', name: '三色盘', price: 5, effect: '万、筒、索三种花色齐全时，+2 翻。',
      when: tiles => [0, 1, 2].every(suit => tiles.some(k => M.suit(k) === suit)), han: 2 }
  ];
  const itemById = new Map(items.map(item => [item.id, item]));
  const REFRESH_PRICE = 2;
  const REMOVE_PRICE = 3;
  const REMOVE_LIMIT = 3;
  const recipes = ['sequences', 'value', 'colors', 'straight', 'flush', 'pairs', 'triples', 'outside'];
  const relicById = new Map(RELICS.map(relic => [relic.id, relic]));
  const deck = Array.from({ length: 136 }, (_, i) => i);
  const outsideKinds = M.KINDS.filter(M.outside);
  const simpleKinds = M.KINDS.filter(k => !M.outside(k));
  const honorKinds = M.KINDS.filter(M.honor);
  const sequences = M.KINDS.filter(k => !M.honor(k) && M.rank(k) <= 6).map(k => [k, k + 1, k + 2]);
  const triplet = k => [k, k, k];
  const triplets = M.KINDS.map(triplet);
  const tileVariant = t => M.kind(t) * 2 + Number(M.isRed(t));
  const randomFrom = (items, random) => items[Math.floor(random() * items.length)];

  function shuffle(items, random) {
    const result = items.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function bestScore(tiles, indicator, build, bonusHan = 0) {
    if (tiles.length !== HAND_SIZE) return null;
    const checked = new Set();
    const kinds = tiles.map(M.kind);
    const shopBonus = (form, yaku, details) => {
      const ids = [form, ...new Set(yaku.map(row => row.name))];
      for (const id of ids) {
        const han = build.levels[id];
        if (han) details.push({ name: upgradeById.get(id).name + '升级', han, category: 'relic' });
      }
      let multiplier = 1;
      for (const id of build.items) {
        const item = itemById.get(id);
        if (!item.when?.(kinds, details, form)) continue;
        if (item.han) details.push({ name: item.name, han: item.han, category: 'relic' });
        if (item.multiplier) {
          multiplier *= item.multiplier;
          details.push({ name: item.name, multiplier: item.multiplier, category: 'relic' });
        }
      }
      return multiplier;
    };
    const input = { tiles, seat: 28, round: 27, tsumo: true, indicators: [indicator],
      relics: build.relics, bonusHan, shopBonus };
    let best = null;
    for (const winning of tiles) {
      const k = M.kind(winning);
      if (checked.has(k)) continue;
      checked.add(k);
      const score = M.score({ ...input, winning });
      if (score && (!best || score.payout.total > best.payout.total ||
          (score.payout.total === best.payout.total && score.han > best.han))) best = score;
    }
    return best;
  }

  function designHand(recipe, random) {
    if (recipe === 'orphans') return [...outsideKinds, randomFrom(outsideKinds, random)];
    const suit = Math.floor(random() * 3);
    const suitKinds = M.KINDS.filter(k => M.suit(k) === suit);
    if (recipe === 'pairs') {
      const kinds = random() < .45 ? [...suitKinds, ...honorKinds] : M.KINDS;
      return shuffle(kinds, random).slice(0, 7).flatMap(k => [k, k]);
    }

    const sameSuit = group => M.suit(group[0]) === suit;
    const plain = sequences.filter(group => group.every(k => !M.outside(k)));
    let groups = sequences;
    let pairs = M.KINDS;
    const fixed = [];
    switch (recipe) {
      case 'sequences':
        if (random() < .65) {
          groups = plain;
          pairs = simpleKinds;
        }
        break;
      case 'colors': {
        const start = 1 + Math.floor(random() * 5);
        for (const base of [0, 9, 18]) fixed.push([base + start, base + start + 1, base + start + 2]);
        groups = [...plain, ...triplets];
        pairs = simpleKinds;
        break;
      }
      case 'straight':
        for (const start of [suit * 9, suit * 9 + 3, suit * 9 + 6]) fixed.push([start, start + 1, start + 2]);
        groups = [...sequences, ...triplets];
        break;
      case 'value':
        fixed.push(triplet(randomFrom([27, 28, 31, 32, 33], random)));
        groups = [...sequences, ...triplets];
        break;
      case 'flush':
        groups = [...sequences.filter(sameSuit), ...triplets.filter(sameSuit)];
        pairs = suitKinds;
        if (random() < .6) {
          fixed.push(triplet(randomFrom(honorKinds, random)));
          pairs = [...suitKinds, ...honorKinds];
        }
        break;
      case 'triples':
        fixed.push(...shuffle(M.KINDS, random).slice(0, 3).map(triplet));
        break;
      case 'outside':
        groups = [...sequences.filter(group => M.rank(group[0]) === 0 || M.rank(group[0]) === 6),
          ...outsideKinds.map(triplet)];
        pairs = outsideKinds;
        break;
    }

    const kinds = fixed.flat();
    const counts = Array(34).fill(0);
    for (const k of kinds) counts[k]++;
    const fits = group => group.every(k => counts[k] + group.filter(other => other === k).length <= 4);
    for (let i = fixed.length; i < 4; i++) {
      const allowed = groups.filter(fits);
      if (!allowed.length) return null;
      for (const k of randomFrom(allowed, random)) {
        kinds.push(k);
        counts[k]++;
      }
    }
    const heads = pairs.filter(k => counts[k] <= 2);
    if (!heads.length) return null;
    const head = randomFrom(heads, random);
    return [...kinds, head, head];
  }

  function availableShape(cards) {
    const counts = M.counts(cards);
    const pairs = M.KINDS.filter(k => counts[k] >= 2);
    if (pairs.length >= 7) return pairs.slice(0, 7).flatMap(k => [k, k]);
    if (outsideKinds.every(k => counts[k])) {
      const head = outsideKinds.find(k => counts[k] >= 2);
      if (head !== undefined) return [...outsideKinds, head];
    }
    const groups = [...sequences.filter(set => set.every(k => counts[k])),
      ...triplets.filter(set => counts[set[0]] >= 3)];
    const chosen = [];
    function fill(start) {
      if (chosen.length === 12) return true;
      for (let i = start; i < groups.length; i++) {
        const group = groups[i];
        if (group[0] === group[1] ? counts[group[0]] < 3 : group.some(k => !counts[k])) continue;
        for (const k of group) counts[k]--;
        chosen.push(...group);
        if (fill(i)) return true;
        chosen.length -= 3;
        for (const k of group) counts[k]++;
      }
      return false;
    }
    for (const head of pairs) {
      counts[head] -= 2;
      if (fill(0)) return [...chosen, head, head];
      counts[head] += 2;
    }
    return null;
  }

  function buildPool(kinds, recipe, cards, random) {
    const wall = shuffle(cards, random);
    const pull = predicate => wall.splice(wall.findIndex(predicate), 1)[0];
    const takeKind = (k, red) => pull(tile => M.kind(tile) === k && (red === undefined || M.isRed(tile) === red));
    const guide = recipe === 'guide';
    const solution = kinds.map(k => takeKind(k, guide ? k === 13 : undefined));
    const held = new Set(kinds);
    const favorable = tile => held.has(M.doraKind(M.kind(tile)));
    const indicator = guide ? takeKind(12) :
      random() < .58 && wall.some(favorable) ? pull(favorable) : wall.pop();
    const pool = solution.slice();
    if (guide) {
      for (const k of [0, 4, 10, 11, 26, 31]) pool.push(takeKind(k, false));
    } else {
      const related = tile => {
        const k = M.kind(tile);
        if (held.has(k)) return true;
        return !M.honor(k) && [...held].some(h => M.suit(h) === M.suit(k) && Math.abs(h - k) === 1);
      };
      while (pool.length < POOL_SIZE) {
        pool.push(pool.length < HAND_SIZE + 4 && wall.some(related) ? pull(related) : wall.pop());
      }
    }
    return { recipe, solution, pool: pool.sort(M.byTile), indicator, wall, bonusHan: 0 };
  }

  function generate({ floor, goal, build, previous, guide, cards, random }) {
    const tutorial = () => buildPool([1, 2, 3, 12, 13, 14, 19, 20, 21, 22, 22, 23, 24, 25], 'guide', cards, random);
    if (guide) return tutorial();
    const choices = (floor >= 12 ? [...recipes, 'orphans'] : recipes).filter(name => name !== previous);
    const available = M.counts(cards);
    let nearest = null;
    let fallback = null;
    for (let attempt = 0; attempt < 26; attempt++) {
      const recipe = randomFrom(choices, random);
      const kinds = designHand(recipe, random);
      if (!kinds) continue;
      const needed = Array(34).fill(0);
      if (kinds.some(k => ++needed[k] > available[k])) continue;
      const puzzle = buildPool(kinds, recipe, cards, random);
      const score = bestScore(puzzle.solution, puzzle.indicator, build);
      if (!score) continue;
      const points = score.payout.total;
      if (points >= goal) {
        if (points * 10n <= goal * 16n) return puzzle;
        if (!nearest || points < nearest.points) nearest = { puzzle, points };
      } else if (!fallback || points > fallback.points) fallback = { puzzle, score, points };
    }
    if (nearest) return nearest.puzzle;
    const puzzle = fallback?.puzzle ?? buildPool(availableShape(cards), 'deck', cards, random);
    const score = fallback?.score ?? bestScore(puzzle.solution, puzzle.indicator, build);
    while (M.payments(score.fu, score.han + puzzle.bonusHan * score.multiplier, false, true).total < goal) puzzle.bonusHan++;
    return puzzle;
  }

  function newRun() {
    return { version: 2, floor: 1, goal: '8000', highest: '0', cleared: 0,
      hearts: MAX_HEARTS, relics: [], items: [], levels: {}, removed: [], coins: 0, shop: null, view: 'play', puzzle: null };
  }

  class Game {
    constructor(snapshot = null, random = Math.random) {
      this.s = snapshot ?? newRun();
      this.random = random;
      this.s.removed ??= [];
      if (!snapshot) this.deal(true);
      else if (snapshot.version === 1) {
        Object.assign(this.s, { version: 2, items: [], levels: {}, removed: [], coins: 0, shop: null });
        delete this.s.rewards;
        if (snapshot.view === 'reward') this.openShop(this.getScore());
      }
    }

    get puzzle() { return this.s.puzzle; }
    get playing() { return this.s.view === 'play'; }
    get goal() { return BigInt(this.s.goal); }
    get relics() { return this.s.relics.map(id => relicById.get(id)); }
    get cards() { return deck.filter(tile => !this.s.removed.includes(tile)); }

    get removalsLeft() { return REMOVE_LIMIT - (this.s.shop?.removedCount ?? 0); }

    canRemove(tiles) {
      if (this.s.view !== 'shop' || !tiles.length || tiles.length > this.removalsLeft ||
          this.s.coins < tiles.length * REMOVE_PRICE) return false;
      const cards = this.cards;
      if (new Set(tiles).size !== tiles.length || !tiles.every(tile => cards.includes(tile))) return false;
      const remaining = cards.filter(id => !tiles.includes(id));
      return remaining.length >= POOL_SIZE + MAX_DRAWS + 1 && Boolean(availableShape(remaining));
    }

    removeTiles(tiles) {
      if (!this.canRemove(tiles)) return false;
      this.s.coins -= tiles.length * REMOVE_PRICE;
      this.s.shop.removedCount = (this.s.shop.removedCount ?? 0) + tiles.length;
      this.s.removed.push(...tiles);
      return true;
    }

    get build() { return { relics: this.relics, items: this.s.items, levels: this.s.levels }; }
    get maxDraws() {
      return Math.min(MAX_DRAWS, BASE_DRAWS + [...this.s.relics, ...this.s.items].filter(id => id === 'supply').length);
    }

    deal(guide = false) {
      this.s.puzzle = {
        ...generate({ floor: this.s.floor, goal: this.goal, build: this.build,
          previous: this.puzzle?.recipe, guide, cards: this.cards, random: this.random }),
        selected: [], drawn: [], drawsLeft: this.maxDraws
      };
      this.s.view = 'play';
    }

    getScore() {
      const { selected, indicator, bonusHan } = this.puzzle;
      return bestScore(selected, indicator, this.build, bonusHan);
    }

    examine() {
      const { selected, pool } = this.puzzle;
      const score = this.getScore();
      const count = selected.length;
      const waits = count === HAND_SIZE - 1 ? M.waits(selected) : [];
      const outs = waits.map(k => {
        const available = pool.filter(tile => M.kind(tile) === k && !selected.includes(tile));
        return { tile: available[0] ?? k * 4 + 1, count: available.length };
      });
      return {
        score, count, outs, ready: Boolean(score && score.payout.total >= this.goal),
        distance: count === HAND_SIZE && !score ? Math.max(0, M.shanten(selected)) : null
      };
    }

    toggle(tile) {
      const { selected, pool } = this.puzzle;
      if (!this.playing || !pool.includes(tile)) return false;
      const i = selected.indexOf(tile);
      if (i >= 0) selected.splice(i, 1);
      else if (selected.length < HAND_SIZE) selected.push(tile);
      else return false;
      selected.sort(M.byTile);
      return true;
    }

    clear() {
      if (!this.playing || !this.puzzle.selected.length) return false;
      this.puzzle.selected = [];
      return true;
    }

    draw() {
      if (!this.playing || !this.puzzle.drawsLeft || !this.puzzle.wall.length) return null;
      const tile = this.puzzle.wall.pop();
      this.puzzle.drawsLeft--;
      this.puzzle.pool.push(tile);
      this.puzzle.pool.sort(M.byTile);
      this.puzzle.drawn.push(tile);
      return tile;
    }

    hint() {
      const { solution, selected, pool } = this.puzzle;
      const unmatched = solution.map(tileVariant);
      const extras = [];
      for (const tile of selected) {
        const i = unmatched.indexOf(tileVariant(tile));
        if (i < 0) extras.push(tile);
        else unmatched.splice(i, 1);
      }
      if (selected.length === HAND_SIZE && extras.length) return { type: 'return', tile: extras[0] };
      const tile = pool.find(t => !selected.includes(t) && unmatched.includes(tileVariant(t)));
      return tile === undefined ? null : { type: 'choose', tile };
    }

    submit() {
      if (!this.playing) return false;
      const score = this.getScore();
      if (!score || score.payout.total < this.goal) return false;
      const points = score.payout.total;
      if (points > BigInt(this.s.highest)) this.s.highest = points.toString();
      this.s.cleared++;
      this.openShop(score);
      return true;
    }

    get availableItems() {
      return items.filter(item => item.id === 'supply' ?
        this.maxDraws < MAX_DRAWS : !this.s.items.includes(item.id));
    }

    get canRefresh() {
      return this.s.view === 'shop' && !this.s.shop.refreshed && this.s.coins >= REFRESH_PRICE &&
        this.availableItems.some(item => !this.s.shop.stock.includes(item.id));
    }

    stock(exclude = []) {
      const eligible = this.availableItems;
      const supply = eligible.filter(item => item.id === 'supply');
      const others = eligible.filter(item => item.id !== 'supply');
      const fresh = shuffle(others.filter(item => !exclude.includes(item.id)), this.random);
      const repeat = shuffle(others.filter(item => exclude.includes(item.id)), this.random);
      return [...supply, ...fresh, ...repeat].slice(0, 3).map(item => item.id);
    }

    openShop(score) {
      const points = score.payout.total;
      const earned = 5 + Number(points >= this.goal * 2n) + Number(points >= this.goal * 3n);
      this.s.coins += earned;
      this.s.shop = { earned, score: { points: points.toString(), fu: score.fu, han: score.han, form: score.form },
        stock: this.stock(), refreshed: false, removedCount: 0 };
      this.s.view = 'shop';
    }

    upgradePrice(id) { return 4 + 2 * (this.s.levels[id] ?? 0); }

    upgrade(id) {
      if (this.s.view !== 'shop' || !upgradeById.has(id)) return false;
      const price = this.upgradePrice(id);
      if (this.s.coins < price) return false;
      this.s.coins -= price;
      this.s.levels[id] = (this.s.levels[id] ?? 0) + 1;
      return true;
    }

    buy(id) {
      if (this.s.view !== 'shop' || !this.s.shop.stock.includes(id)) return false;
      const item = itemById.get(id);
      if (this.s.coins < item.price) return false;
      this.s.coins -= item.price;
      this.s.items.push(id);
      this.s.shop.stock = this.s.shop.stock.filter(other => other !== id);
      return true;
    }

    refreshShop() {
      if (!this.canRefresh) return false;
      const stock = this.stock(this.s.shop.stock);
      this.s.coins -= REFRESH_PRICE;
      this.s.shop.refreshed = true;
      this.s.shop.stock = stock;
      return true;
    }

    nextFloor() {
      if (this.s.view !== 'shop') return false;
      this.s.hearts = Math.min(MAX_HEARTS, this.s.hearts + 1);
      this.s.shop = null;
      this.s.floor++;
      this.s.goal = ((this.goal * 142n + 9999n) / 10000n * 100n).toString();
      this.deal();
      return true;
    }

    redeal() {
      if (!this.playing) return false;
      this.s.hearts--;
      if (this.s.hearts === 0) this.s.view = 'over';
      else this.deal();
      return true;
    }
  }

  return { Game, POOL_SIZE, HAND_SIZE, MAX_HEARTS, FORMS, relicById, itemById, upgrades, upgradeById, REFRESH_PRICE, REMOVE_PRICE };
})();

    let art;
    if (family === 0) {
      art = calligraphy(Mahjong.DIGITS[n - 1], 21, 23, rare ? red : dark) + calligraphy('萬', 41, 20, red);

      const radius = n <= 3 ? 5.4 : n >= 7 ? 3.9 : 4.7;
      art = positions[n].map(([x, y], i) => {
        const color = rare || (n === 5 && i === 2) || (n === 9 && i >= 3 && i < 6) ? red :

      const height = n >= 7 ? 8 : n >= 4 ? 11 : 13;
      art = positions[n].map(([x, y], i) => {
        const color = rare || (n === 5 && i === 2) || (n === 7 && i < 3) || (n === 9 && i >= 3 && i < 6) ? red : forest;

    }
    if (rare) art += '<circle cx="30.6" cy="5.6" r="2" fill="' + red + '"/>';
    const svg = '<svg viewBox="0 0 36 48" aria-hidden="true">' + art + '</svg>';
    faces.set(key, svg);
    return svg;
  }

  function tile(id, extra = '', control = null) {
    const cls = 'tile' + (extra ? ' ' + extra : '');
    const name = Mahjong.tileName(id);

        ' data-action="tile" data-tile="' + id + '"' + (control.disabled ? ' disabled' : '') +
        '>' + face(id) + '</button>';
    }
    return '<span class="' + cls + '" role="img" aria-label="' + name + '" title="' + name + '">' + face(id) + '</span>';
  }

  return { icon, tile };
})();

(() => {

  };

  function loadGame() {
    try {
      const s = JSON.parse(localStorage.getItem(saveKey));
      if ([1, 2].includes(s?.version) && Number.isSafeInteger(s.floor) && s.floor >= 1 &&
          ['play', 'reward', 'shop', 'over'].includes(s.view) &&

          (s.version === 1 || (Array.isArray(s.items) && s.items.every(id => itemById.has(id)) &&
            (s.removed === undefined || (Array.isArray(s.removed) && new Set(s.removed).size === s.removed.length &&
              s.removed.every(id => Number.isInteger(id) && id >= 0 && id < 136))) &&
            Number.isSafeInteger(s.coins) && s.coins >= 0 && s.levels &&
            Object.entries(s.levels).every(([id, level]) => upgradeById.has(id) && Number.isSafeInteger(level) && level > 0) &&
            (s.view !== 'shop' || (Array.isArray(s.shop?.stock) && s.shop.stock.every(id => itemById.has(id)) &&
              s.shop.score && FORMS[s.shop.score.form] && /^\d+$/.test(s.shop.score.points)))))) return new Game(s);
    } catch { /* A browser may disable local storage. */ }
    return new Game();
  }

  let game = loadGame();

  let hint = null;
  let shopTab = 'items';
  let upgradeId = 'standard';

  }

  function button(label, action, options = {}) {
    const { glyph, type, disabled, extra = '', aria = '' } = options;
    return '<button type="button" class="action-btn' + (type ? ' ' + type : '') + '" data-action="' + action +
      '"' + (disabled ? ' disabled' : '') + (aria ? ' ' + aria : '') + '>' +

    $('hand-zone').innerHTML = '<div class="zone-header"><h2>和牌区</h2><span class="hand-count">' +
      selected.length + ' / ' + HAND_SIZE + '</span></div><div class="tile-grid tray-grid">' + tiles +
      '<span class="slot" aria-hidden="true"></span>'.repeat(HAND_SIZE - selected.length) +
      '</div><div class="feedback"><span role="status">' + handMessage() + '</span>' +
      (assessment.score && game.playing ? '<button type="button" data-action="details">计分明细</button>' : '') + '</div>';
  }

  function renderPool() {
    const { pool, selected, drawn, indicator, bonusHan } = game.puzzle;
    const doraKind = M.doraKind(M.kind(indicator));
    const outs = new Set(assessment.outs.filter(row => row.count > 0).map(row => M.kind(row.tile)));
    const cells = pool.map(id => {
      const chosen = selected.includes(id);
      const styles = [
        chosen ? 'selected-pool' : '',
        drawn.includes(id) && !chosen ? 'new-draw' : '',
        !chosen && outs.has(M.kind(id)) ? 'is-out' : '',
        hint?.tile === id ? 'hint-' + hint.type : ''
      ].filter(Boolean).join(' ');
      return tile(id, styles, { verb: chosen ? '退回' : '选入', pressed: chosen,
        disabled: !game.playing || !chosen && selected.length === HAND_SIZE });
    }).join('');
    $('pool-zone').innerHTML = '<div class="zone-header"><h2>候选牌<small>' + pool.length + ' 张</small></h2>' +
      '<div class="dora" title="指示牌 ' + M.tileName(indicator) + '">' +
      (bonusHan ? '<strong>登阶 +' + bonusHan + ' 翻</strong>' : '') + '宝牌' + tile(doraKind * 4 + 1) + '</div></div>' +
      '<div class="tile-grid pool-grid">' + cells + '</div>';
  }

  function renderControls() {
    const { drawsLeft } = game.puzzle;
    $('controls').innerHTML = button('提示', 'hint', { glyph: 'hint', type: 'quiet', disabled: !game.playing }) +
      button('清空', 'clear', { type: 'quiet', disabled: !assessment.count || !game.playing }) +
      button('补牌', 'draw', { glyph: 'layers', disabled: !drawsLeft || !game.playing, extra: '<small>' + drawsLeft + '</small>',
        aria: 'aria-label="补一张候选牌，剩余 ' + drawsLeft + ' 次"' }) +
      button('和牌过关', 'submit', { glyph: 'arrow', type: 'primary', disabled: !assessment.ready || !game.playing });
    $('utility').innerHTML = '<button type="button" data-action="redeal"' + (game.playing ? '' : ' disabled') +
      '>' + icon('restart') + '重发本关 · 1 命</button>' +
      (game.s.items.length || game.s.relics.length || game.s.removed.length || Object.keys(game.s.levels).length ?
        '<button type="button" data-action="build">' + icon('box') + '构筑</button>' : '');
  }

  function heading(title, locked = false) {
    return '<div class="modal-header"><h2 id="modal-title">' + title + '</h2>' +
      (locked ? '' : button('', 'close', { glyph: 'x', type: 'quiet', aria: 'aria-label="关闭"' })) + '</div>';
  }

  function pointsHTML(score) {
    return '<div class="result-score"><b>' + format(score.payout.total) + ' 分</b><span>' + FORMS[score.form] +
      ' · ' + score.fu + ' 符 ' + score.han + ' 翻</span></div>';
  }

  function breakdown(score) {
    return '<dl class="score-list">' + score.details.map(row => '<div class="type-' + row.category +
      '"><dt>' + row.name + '</dt><dd>' + (row.multiplier ? '×' + row.multiplier + ' 总翻数' : '+' + (row.fu ? row.fu + ' 符' : row.han + ' 翻')) + '</dd></div>').join('') + '</dl>';
  }

  function shopHTML() {
    const { shop, coins, levels, floor } = game.s;
    const result = { ...shop.score, payout: { total: shop.score.points } };
    const tabs = '<div class="shop-tabs">' + [['items', '道具'], ['upgrades', '牌型升级'], ['deck', '删牌']].map(([id, label]) =>
      button(label, 'shop-tab', { type: shopTab === id ? '' : 'quiet',
        aria: 'data-option="' + id + '" aria-pressed="' + (shopTab === id) + '"' })).join('') + '</div>';
    let products;
    if (shopTab === 'items') {
      products = shop.stock.length ? '<div class="shop-products">' + shop.stock.map(id => {
        const item = itemById.get(id);
        return '<div class="shop-product"><div><b>' + item.name + '</b><small>' + item.effect + '</small></div>' +
          button('买 ' + item.price + ' 金', 'buy', { disabled: coins < item.price,
            aria: 'data-option="' + id + '" aria-label="购买' + item.name + '，' + item.price + ' 金"' }) + '</div>';
      }).join('') + '</div>' : '<p>这批道具已售完。</p>';
      products += '<div class="shop-refresh">' + button(shop.refreshed ? '已刷新' : '刷新 · ' + REFRESH_PRICE + ' 金',
        'refresh-shop', { type: 'quiet', disabled: !game.canRefresh }) + '</div>';
    } else if (shopTab === 'deck') {
      products = deckHTML();
    } else {
      const level = levels[upgradeId] ?? 0;
      const price = game.upgradePrice(upgradeId);
      const options = form => upgrades.filter(row => row.form === form).map(row => '<option value="' +
        row.id + '"' + (upgradeId === row.id ? ' selected' : '') + '>' + row.name + '</option>').join('');
      products = '<label class="upgrade-label" for="upgrade-select">升级对象</label><select id="upgrade-select">' +
        '<optgroup label="基本牌型">' + options(true) + '</optgroup><optgroup label="役和役满">' + options(false) +
        '</optgroup></select><div class="shop-product upgrade-product"><div><b>加成 +' + level + ' → +' + (level + 1) +
        ' 翻</b><small>和牌符合所选牌型或役时生效。</small></div>' +
        button('升级 · ' + price + ' 金', 'upgrade', { disabled: coins < price }) + '</div>';
    }
    return heading('第 ' + floor + ' 关商店', true) + pointsHTML(result) +
      '<div class="wallet"><span>本关 +' + shop.earned + ' 金</span><b>余额 ' + coins + ' 金</b></div>' +
      tabs + products + '<div class="modal-actions">' + button('下一关', 'next-floor', { type: 'primary', glyph: 'arrow' }) + '</div>';
  }

  const deckVariant = id => M.kind(id) * 2 + Number(M.isRed(id));
  function deckHTML() {
    const cards = game.cards;
    const stacks = new Map();
    for (const id of cards) {
      const key = deckVariant(id);
      if (!stacks.has(key)) stacks.set(key, []);
      stacks.get(key).push(id);
    }
    const cost = removeIds.length * REMOVE_PRICE;
    const canRemove = game.canRemove(removeIds);
    const message = !game.removalsLeft ? '本次进店的删牌次数已用完。' :
      game.s.coins < Math.max(REMOVE_PRICE, cost) ? '金币不足。' :
      !removeIds.length ? '点选要移出的牌，同种牌可选多张。' :
      canRemove ? '确认后，后续发牌和补牌都使用新牌库。' : '删掉所选牌后无法正常发牌或和牌。';
    return '<p>牌库 ' + cards.length + ' 张 · 本店还可删 ' + game.removalsLeft + ' 张 · 每张 ' + REMOVE_PRICE + ' 金</p>' +
      '<div class="deck-grid">' + [...stacks.values()].map(ids => {
        const chosen = ids.filter(id => removeIds.includes(id)).length;
        const next = ids.find(id => !removeIds.includes(id));
        return '<button type="button" class="deck-card" data-action="select-remove" data-tile="' + next +
          '" aria-label="' + M.tileName(ids[0]) + '，剩余 ' + ids.length + ' 张" aria-pressed="' + Boolean(chosen) + '"' +
          (next === undefined || removeIds.length >= game.removalsLeft ? ' disabled' : '') +
          '>' + tile(ids[0]) + '<span>×' + ids.length + (chosen ? ' · −' + chosen : '') + '</span></button>';
      }).join('') + '</div>' +
      (removeIds.length ? '<div class="removal-picks">' + removeIds.map(id =>
        button(M.tileName(id) + ' ×', 'undo-remove', { type: 'quiet', aria: 'data-tile="' + id +
          '" aria-label="取消选择' + M.tileName(id) + '"' })).join('') + '</div>' : '') +
      '<div class="shop-product"><small role="status">' + message + '</small>' +
      button('删 ' + removeIds.length + ' 张 · ' + cost + ' 金', 'remove-tile', { disabled: !canRemove }) + '</div>';
  }

  function buildHTML() {
    const { items, relics, levels } = game.s;
    const owned = [
      ...[...new Set(items)].map(id => [itemById.get(id), items.filter(other => other === id).length]),
      ...[...new Set(relics)].map(id => [relicById.get(id), relics.filter(other => other === id).length])
    ];
    return heading('本轮构筑') + '<p>每关可补 ' + game.maxDraws + ' 张 · 牌库 ' + game.cards.length + ' 张 · 余额 ' + game.s.coins + ' 金</p>' +
      Object.entries(levels).map(([id, value]) => '<div class="build-row"><b>' + upgradeById.get(id).name +
        '</b><small>+' + value + ' 翻</small></div>').join('') +
      owned.map(([item, count]) => '<div class="build-row"><b>' + item.name + (count > 1 ? ' ×' + count : '') +
        '</b><small>' + item.effect + '</small></div>').join('');
  }

  const rules = heading('玩法') + '<ul><li>每关发 ' + POOL_SIZE + ' 张候选牌。点牌选入，点已选牌退回。最多选 ' +
    HAND_SIZE + ' 张，默认可补两张候选牌。</li><li>四面子一雀头、七对子或国士无双都能和牌。单手分数达到目标即可过关。</li>' +
    '<li>按东场南家门前自摸计分。系统选得分最高的和牌张，基本点为符 × 2<sup>翻+2</sup>，点数无上限。</li>' +
    '<li>重发扣 1 命。每次过关赚 5–7 金，进入商店。每次进店最多删 3 张牌，每张 3 金。离开商店时回复 1 命。先加翻，再乘总翻数。例如 5 翻加 2 翻后 ×2，结算 14 翻。</li></ul>' +
    '<div class="modal-actions">' + button('重新挑战', 'restart', { glyph: 'restart' }) + '</div>';

  function renderModal() {
    let content;
    switch (overlay) {
      case 'rules': content = rules; break;
      case 'details': content = heading('计分明细') + pointsHTML(assessment.score) + breakdown(assessment.score); break;
      case 'build': content = buildHTML(); break;
      case 'shop': content = shopHTML(); break;
      case 'over':
        content = heading('挑战结束', true) + '<p>通过 ' + game.s.cleared + ' 关，最高单手 ' +
          format(game.s.highest) + ' 分。</p><div class="modal-actions">' +
          button('再来一轮', 'reset', { type: 'primary', glyph: 'restart' }) + '</div>';
        break;
      case 'redeal':
        content = heading('重发本关？') + '<p>消耗 1 命。' + (game.s.hearts === 1 ? '本轮挑战将结束。' :
          '重新发 ' + POOL_SIZE + ' 张候选牌。') + '</p><div class="modal-actions">' +
          button('取消', 'close', { type: 'quiet' }) + button('确认重发', 'confirm-redeal', { type: 'primary' }) + '</div>';
        break;
      case 'restart':
        content = heading('重新挑战？') + '<p>当前挑战将从第 1 关开始。</p><div class="modal-actions">' +
          button('取消', 'close', { type: 'quiet' }) + button('从第 1 关开始', 'reset', { type: 'primary' }) + '</div>';
        break;
      default: return;
    }
    $('modal-content').innerHTML = content;
    if (!modal.open) {
      if (typeof modal.showModal === 'function') modal.showModal();
      else { modal.classList.add('fallback'); modal.setAttribute('open', ''); }
    }
  }

  function hideModal() {
    overlay = '';
    if (modal.open && typeof modal.close === 'function') modal.close();
    else modal.removeAttribute('open');
  }

  function show(kind) { overlay = kind; renderModal(); }
  function close() { if (!lockedModals.has(overlay)) hideModal(); }

  function render() {
    assessment = game.examine();
    renderStatus();
    renderHand();
    renderPool();
    renderControls();
    if (!game.playing) show(game.s.view);
    else if (lockedModals.has(overlay)) hideModal();
  }

  function move() {
    hint = null;
    save();
    render();
  }

  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  document.addEventListener('click', event => {
    const el = event.target.closest('button[data-action]');
    if (!el || el.disabled) return;
    switch (el.dataset.action) {
      case 'tile':
        if (game.toggle(Number(el.dataset.tile))) {
          move();
          if (event.detail === 0) document.querySelector('#pool-zone [data-tile="' + el.dataset.tile + '"]')
            ?.focus({ preventScroll: true });
        }
        break;
      case 'clear':
        if (game.clear()) move();
        break;
      case 'draw': {
        const drawn = game.draw();
        if (drawn !== null) {
          move();
          notice('补到 ' + M.tileName(drawn));
        }
        break;
      }
      case 'hint':
        if (assessment.ready) { notice('分数已达标，可以过关。'); break; }
        hint = game.hint();
        if (hint) {
          renderHand();
          renderPool();
          notice((hint.type === 'return' ? '试着退回 ' : '试着选入 ') + M.tileName(hint.tile));
        }
        break;
      case 'submit':
        if (game.submit()) { shopTab = 'items'; removeIds = []; move(); }
        break;
      case 'select-remove': removeIds.push(Number(el.dataset.tile)); renderModal(); break;
      case 'undo-remove': removeIds = removeIds.filter(id => id !== Number(el.dataset.tile)); renderModal(); break;
      case 'remove-tile':
        if (game.removeTiles(removeIds)) { removeIds = []; move(); }
        break;
      case 'shop-tab': shopTab = el.dataset.option; renderModal(); break;
      case 'buy': if (game.buy(el.dataset.option)) move(); break;
      case 'upgrade': if (game.upgrade(upgradeId)) move(); break;
      case 'refresh-shop': if (game.refreshShop()) move(); break;
      case 'next-floor': if (game.nextFloor()) move(); break;
      case 'rules':
      case 'details':
      case 'build':
      case 'redeal':
      case 'restart':
        show(el.dataset.action);
        break;
      case 'confirm-redeal': hideModal(); if (game.redeal()) move(); break;
      case 'reset': hideModal(); game = new Game(); move(); break;
      case 'close': close(); break;
    }
  });
  modal.addEventListener('change', event => {
    if (event.target.id === 'upgrade-select') {
      upgradeId = event.target.value;
      renderModal();
      $('upgrade-select')?.focus({ preventScroll: true });
    }
  });
  modal.addEventListener('cancel', event => { event.preventDefault(); close(); });
  modal.addEventListener('click', event => { if (event.target === modal) close(); });
  save();
  render();
})();

</script>
</body>
</html>
