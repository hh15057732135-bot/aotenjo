<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101511">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="青天井是一款日式立直麻将肉鸽。与三位 AI 对打，以无上限计分闯关，收集遗物，挑战无尽牌局。">
  <title>青天井 · 无尽牌局</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%23d2ec83'/%3E%3Cpath d='M24 7 41 24 24 41 7 24Z M16 24h16M24 16v16' fill='none' stroke='%231c2b17' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
:root {
  --ink: #101511;
  --panel: #171f19;
  --panel-soft: #1b251d;
  --line: #2a382c;
  --text: #f0f1e6;
  --muted: #a1ad9c;
  --subtle: #758575;
  --lime: #d3ed85;
  --lime-dark: #24371f;
  --amber: #e5bc80;
  --rose: #ed8c81;
  --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  font-family: var(--sans);
  color: var(--text);
  background: var(--ink);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 300px;
  min-height: 100vh;
  min-height: 100dvh;
  background: radial-gradient(ellipse at 50% -30%, #213227 0%, #121a14 43%, var(--ink) 72%);
}
button, a { -webkit-tap-highlight-color: transparent; }
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
a { color: var(--lime); }
[hidden] { display: none !important; }
.ico { display: inline-block; width: 1em; height: 1em; flex-shrink: 0; vertical-align: -.13em; }
[data-icon] { display: inline-flex; align-items: center; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.shell {
  width: min(1460px, 100%);
  margin-inline: auto;
  padding-left: max(34px, env(safe-area-inset-left));
  padding-right: max(34px, env(safe-area-inset-right));
}
.site-header {
  border-bottom: 1px solid #2a392b;
  background: #101812e8;
  padding-top: env(safe-area-inset-top, 0px);
}
.nav { height: 67px; display: flex; align-items: center; gap: 17px; }
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark {
  display: grid; place-items: center; width: 39px; height: 39px; border-radius: 11px;
  color: #23341d; background: var(--lime); box-shadow: inset 0 1px 0 #ffffff60;
}
.brand-mark .ico { width: 26px; height: 26px; }
.brand-name { font-size: 21px; letter-spacing: .07em; font-weight: 780; white-space: nowrap; line-height: 1.06; }
.brand-name small { display: block; margin-top: 5px; font: 9px/1 var(--mono); letter-spacing: .25em; color: var(--muted); }
.nav-divider { height: 26px; width: 1px; background: var(--line); }
.mode-badge {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px;
  color: var(--lime); background: #242f1e; border: 1px solid #37462c;
  border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.mode-badge i, .live-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--lime);
  box-shadow: 0 0 9px #cce48666;
}
.nav-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-button, .nav-record {
  background: #1b241c; border: 1px solid #304032; border-radius: 9px;
  min-height: 40px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; padding: 0 10px; color: #c6d2bf; transition: background .15s ease, color .15s ease;
}
.icon-button .ico, .nav-record .ico { font-size: 17px; }
.nav-record { background: transparent; border-color: transparent; padding-right: 15px; font-size: 12px; gap: 8px; }
.nav-record .ico { color: var(--amber); }
.nav-record strong { color: var(--text); font: 700 13px var(--mono); white-space: nowrap; }
.nav-label { font-size: 12px; }
.icon-button:hover, .nav-record:hover { background: #27372a; color: var(--text); }

.game-heading { display: flex; align-items: end; justify-content: space-between; padding: 29px 0 22px; gap: 12px; }
.eyebrow {
  display: flex; align-items: center; gap: 9px; color: var(--lime);
  font: 700 10px/1.2 var(--mono); letter-spacing: .23em;
}
.eyebrow > span { width: 19px; height: 1px; background: var(--lime); }
.game-heading h1 { font-size: clamp(28px, 2.7vw, 40px); line-height: 1.13; margin: 9px 0 5px; letter-spacing: .04em; font-weight: 780; }
.heading-period { color: var(--lime); margin-left: 1px; }
.game-heading p { color: var(--muted); margin: 0; font-size: 13px; letter-spacing: .045em; }
.save-state {
  display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px;
  white-space: nowrap; margin-bottom: 2px;
}
.save-state .ico { color: #a5c785; font-size: 14px; }

.game-layout { display: grid; grid-template-columns: minmax(167px, 215px) minmax(0, 1fr) minmax(211px, 257px); gap: 15px; align-items: start; }
.left-rail, .right-rail { min-width: 0; display: grid; align-content: start; gap: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; }
.panel-body { padding: 15px; }
.panel-title { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 0 0 12px; }
.panel-title h2 { margin: 0; font-size: 14px; letter-spacing: .035em; display: flex; gap: 7px; align-items: center; font-weight: 740; }
.panel-title h2 .ico { color: var(--lime); font-size: 16px; }
.panel-title small { font: 10px var(--mono); color: var(--subtle); white-space: nowrap; }
.challenge-panel { background: linear-gradient(140deg, #263321, #1c281d 68%); border-color: #3d5036; }
.challenge-panel .panel-body { padding: 15px 15px 12px; }
.floor-marker { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.floor-marker b { font: 750 11px var(--mono); color: var(--lime); letter-spacing: .1em; white-space: nowrap; }
.floor-marker .stage-label {
  border: 1px solid #59734878; border-radius: 5px; color: #c3d8ae;
  font-size: 10px; padding: 3px 6px; white-space: nowrap;
}
.challenge-caption { margin: 15px 0 5px; color: #b7c7ae; font-size: 11px; }
.challenge-score { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; min-width: 0; }
.challenge-score strong { font: 750 clamp(21px, 2.1vw, 29px)/1 var(--mono); color: var(--lime); letter-spacing: -.08em; }
.challenge-score span { font: 11px var(--mono); color: #bfceb5; }
.track { height: 6px; margin: 10px 0 12px; background: #111c12; border-radius: 5px; overflow: hidden; }
.track > span { display: block; height: 100%; background: var(--lime); border-radius: inherit; transition: width .25s ease; }
.life { display: flex; align-items: center; justify-content: space-between; gap: 5px; padding-top: 10px; border-top: 1px solid #49634266; color: #bccdb4; font-size: 11px; }
.hearts { display: flex; align-items: center; gap: 5px; color: #53664c; font-size: 15px; white-space: nowrap; }
.hearts .full { color: var(--amber); }
.route-list { list-style: none; padding: 0; margin: 3px 0 0; }
.route-list li { display: flex; align-items: center; gap: 10px; min-height: 46px; position: relative; }
.route-list li:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 36px; width: 1px; height: 21px; background: #3a4939; }
.route-node {
  display: grid; place-items: center; z-index: 1; width: 27px; height: 27px; flex-shrink: 0; border-radius: 7px;
  color: var(--muted); background: #202c22; border: 1px solid #354538; font: 650 11px var(--mono);
}
.route-text { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.route-text b { color: #c9d3c5; font-weight: 650; }
.route-text small { font-size: 10px; color: var(--subtle); }
.route-list .current .route-node { background: var(--lime); color: #23381b; border-color: var(--lime); box-shadow: 0 0 18px #d5ed8525; }
.route-list .current .route-text b { color: var(--lime); }
.route-list .done .route-node { color: var(--lime); }
.route-infinity { padding: 8px 0 0 38px; color: var(--subtle); font: 10px/1.1 var(--mono); letter-spacing: .13em; }

.game-center { min-width: 0; }
.board { border: 1px solid #354937; background: #151f17; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 50px #0003; }
.board-top {
  min-height: 58px; display: flex; align-items: center; gap: 13px; padding: 9px 13px;
  background: linear-gradient(110deg, #232f23, #19271c); border-bottom: 1px solid #3a503d;
}
.round-tag { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 740; white-space: nowrap; }
.wind-box { width: 30px; height: 30px; display: grid; place-items: center; color: var(--lime); background: #30432a; border: 1px solid #4f6542; border-radius: 7px; font-size: 16px; }
.round-tag small { color: var(--muted); font-size: 10px; font-weight: 500; }
.board-stats { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.wall-count, .dora-block { display: flex; align-items: center; gap: 5px; color: #b2c1af; font-size: 10px; white-space: nowrap; }
.wall-count .ico { font-size: 15px; color: #a7bd9b; }
.wall-count strong { font: 750 16px var(--mono); color: #f0f4e9; margin-left: 2px; }
.dora-block { border-left: 1px solid #3b4d3c; padding-left: 10px; }
.dora-block .tile { width: 21px; --tile-edge: 2px; }
.dora-tray { display: flex; gap: 3px; align-items: center; }
.tile-spacer { display: inline-block; width: 12px; aspect-ratio: 3 / 4; border: 1px dashed #5f7358; border-radius: 3px; opacity: .65; }

.felt {
  height: clamp(326px, 29vw, 430px);
  position: relative; isolation: isolate;
  background: radial-gradient(ellipse at 50% 52%, #225642 0, #194737 45%, #10392d 77%, #113125 100%);
  overflow: hidden;
}
.felt::before {
  content: ""; position: absolute; z-index: -1; inset: 0; opacity: .32;
  background-image: url("data:image/svg+xml,%3Csvg width='32' height='32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M16 0 32 16 16 32 0 16ZM0 0l32 32m0-32L0 32M16 0v32M0 16h32' stroke='%2397c0a5' stroke-width='.45' fill='none' opacity='.39'/%3E%3C/svg%3E");
  mask-image: radial-gradient(ellipse, transparent 18%, black 100%);
}
.felt::after { content: ""; position: absolute; pointer-events: none; z-index: -1; inset: 9px; border: 1px solid #a8cdaa35; border-radius: 10px; box-shadow: inset 0 0 0 3px #10382750, inset 0 0 0 4px #a8cdaa18; }
.felt-corner {
  position: absolute; color: #a2c5a55c; width: 20px; height: 20px; pointer-events: none;
}
.felt-corner .ico { width: 100%; height: 100%; }
.felt-corner.tl { top: 15px; left: 15px; }
.felt-corner.tr { top: 15px; right: 15px; transform: rotate(90deg); }
.felt-corner.bl { bottom: 15px; left: 15px; transform: rotate(-90deg); }
.felt-corner.br { bottom: 15px; right: 15px; transform: rotate(180deg); }
.felt-index { position: absolute; left: 20px; bottom: 20px; font: 10px var(--mono); letter-spacing: .18em; color: #a0c0a590; }
.felt-mode { position: absolute; right: 21px; bottom: 20px; font: 10px var(--mono); letter-spacing: .16em; color: #a0c0a590; }
.seat-card {
  position: absolute; display: flex; align-items: center; gap: 8px; min-width: 98px; z-index: 2;
  background: #132c22ef; border: 1px solid #5982688a; padding: 6px 8px; border-radius: 9px;
  box-shadow: 0 4px 12px #0b281e38;
}
.seat-card.current { border-color: #c8df7e; box-shadow: 0 0 15px #d0e78b25; }
.seat-card.seat-2 { top: 13px; left: 50%; transform: translateX(-50%); }
.seat-card.seat-3 { top: 25%; left: 17px; }
.seat-card.seat-1 { top: 25%; right: 17px; }
.avatar {
  display: grid; place-items: center; width: 32px; height: 32px; border-radius: 6px;
  color: #e6d5ec; background: #455040; flex-shrink: 0; border: 1px solid #ffffff1a;
}
.avatar .ico { width: 25px; height: 25px; }
.seat-1 .avatar { color: #f3c09c; background: #684335; }
.seat-2 .avatar { color: #d9cfef; background: #49465c; }
.seat-3 .avatar { color: #d0e5e2; background: #315a55; }
.seat-name { display: flex; align-items: center; gap: 5px; font-size: 11px; white-space: nowrap; line-height: 1.15; font-weight: 750; }
.seat-name em {
  display: grid; place-items: center; width: 15px; height: 15px; font: 10px var(--sans); border-radius: 4px;
  color: #bbd0bc; background: #2a4736;
}
.seat-name em.dealer { color: var(--lime); background: #435a32; }
.seat-points { display: block; margin-top: 3px; color: #f2f3e3; font: 670 11px/1 var(--mono); }
.seat-state { margin-left: 2px; color: var(--amber); font-size: 9px; white-space: nowrap; }
.seat-melds {
  position: absolute; z-index: 1; display: flex; gap: 3px; justify-content: center;
  left: 50%; top: calc(100% + 3px); width: max-content; transform: translateX(-50%);
}
.seat-melds .tile { width: 12px; }
.seat-melds .meld-group { padding: 1px; gap: 1px; background: #123b2d; }
.seat-2 .seat-melds { left: calc(100% + 5px); top: 50%; transform: translateY(-50%); }
.seat-3 .seat-melds { left: 0; transform: none; }
.seat-1 .seat-melds { left: auto; right: 0; transform: none; }
.river {
  position: absolute; --mini: clamp(16px, 2vw, 25px); --columns: 6; display: grid;
  grid-template-columns: repeat(var(--columns), var(--mini)); grid-auto-rows: calc(var(--mini) * 1.25);
  gap: 2px; justify-items: center; align-items: center; align-content: start;
  min-height: calc(var(--mini) * 1.25);
}
.river-seven { --columns: 7; }
.river-eight { --columns: 8; }
.river-2 { top: 18%; left: 50%; transform: translateX(-50%); }
.river-3 { top: 45%; left: 17px; }
.river-1 { top: 45%; right: 17px; }
.river-0 { top: 71%; left: 50%; transform: translateX(-50%); }
.river .tile, .river .empty-tile { width: var(--mini); --tile-edge: 2px; }
.empty-tile { height: 100%; border: 1px solid #91c3a12e; border-radius: 4px; background: #14372a35; }
.river .latest { outline: 1px solid #d5ef85; outline-offset: 1px; animation: arrival .19s ease-out both; }
.river .riichi-tile { transform: rotate(90deg) scale(.84); background-color: #eddfb8; }
@keyframes arrival { from { opacity: .45; translate: 0 -4px; } to { opacity: 1; translate: 0 0; } }

.compass {
  position: absolute; top: 50%; left: 50%; translate: -50% -50%; width: 103px; aspect-ratio: 1;
  display: grid; place-content: center; justify-items: center;
  color: #dcf0b4; background: radial-gradient(circle, #2f5a3f 0%, #1a4434 73%);
  border: 1px solid #90b5856c; border-radius: 50%; box-shadow: 0 0 0 6px #153b2a55, 0 0 0 7px #91b6823a, inset 0 0 0 5px #173c2e86;
}
.compass::before { content: ""; position: absolute; inset: 8px; transform: rotate(45deg); border: 1px solid #a2cc9c2b; border-radius: 10px; }
.compass b { font: 750 35px/1 "Songti SC", "Noto Serif CJK SC", var(--sans); text-shadow: 0 2px 10px #0d3c20; }
.compass small { color: #a8c59f; margin-top: 7px; font: 8px/1 var(--mono); letter-spacing: .16em; white-space: nowrap; }
.compass .pip { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #91b48290; }
.compass .pip.n { top: -2px; left: calc(50% - 2px); }
.compass .pip.e { right: -2px; top: calc(50% - 2px); }
.compass .pip.s { bottom: -2px; left: calc(50% - 2px); background: var(--lime); }
.compass .pip.w { left: -2px; top: calc(50% - 2px); }
.stick {
  position: absolute; left: 50%; top: calc(50% + 56px); translate: -50% 0; display: flex;
  align-items: center; gap: 5px; font: 10px var(--mono); color: #e4dec6;
}
.stick i { display: block; width: 22px; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#f3e7c7 44%,#be5545 44%,#be5545 57%,#f3e7c7 57%); }

.hand-console { padding: 13px; background: linear-gradient(160deg, #202d22, #161f18); border-top: 1px solid #3b523e; }
.hand-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 11px; min-height: 26px; }
.your-wind { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 5px; background: #344a2d; color: var(--lime); font-size: 13px; font-weight: 750; }
.you-name { font-weight: 720; font-size: 12px; }
.you-points { color: #d4dccd; font: 700 12px var(--mono); }
.turn-pill {
  margin-left: auto; display: flex; gap: 6px; align-items: center; min-height: 23px; padding: 3px 7px;
  border-radius: 5px; background: #273a28; border: 1px solid #415a3d; color: #c7e68e; font-size: 10px; white-space: nowrap;
}
.turn-pill.wait { color: #c0ccbd; border-color: #3d5041; background: #253126; }
.turn-pill.wait .live-dot { opacity: .45; }
.turn-pill.attn { color: var(--amber); border-color: #765c3f; background: #423526; }
.turn-pill.attn .live-dot { background: var(--amber); }
.hand-row { display: flex; align-items: flex-end; gap: clamp(2px, .35vw, 5px); min-height: 54px; }
.hand-row > .tile { flex: 1 1 0; min-width: 0; max-width: 46px; aspect-ratio: 3 / 4.17; }
.hand-row > .tile.drawn { margin-left: clamp(4px, 1vw, 12px); }
.tile {
  --tile-edge: 4px;
  position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  padding: 0 0 var(--tile-edge); aspect-ratio: 3 / 4.2; border: 1px solid #ddd6bb; border-radius: 11%;
  background: linear-gradient(148deg, #fffcf0 0%, #f4efdb 62%, #e8e1ca 100%);
  box-shadow: inset 0 calc(-1 * var(--tile-edge)) #b2bda0, 0 2px 3px #030b0855;
  color: #24372d; vertical-align: middle; user-select: none; -webkit-user-select: none;
}
.tile svg { display: block; width: 100%; height: 100%; max-height: 100%; overflow: visible; }
.tile.is-back { border-color: #6c896b; background: linear-gradient(155deg, #476b49, #234530); box-shadow: inset 0 calc(-1 * var(--tile-edge)) #183724; }
.tile.is-back svg { opacity: .72; }
.hand-row button.tile { cursor: pointer; transition: translate .12s ease, box-shadow .12s ease, filter .12s ease; }
.hand-row button.tile:not(:disabled):hover { filter: brightness(1.06); }
.hand-row button.tile:disabled { filter: saturate(.8) brightness(.91); }
.hand-row .tile.hinted:not(.selected) { outline: 1px solid var(--lime); outline-offset: 2px; }
.hand-row .tile.hinted::after {
  content: ""; position: absolute; width: 4px; height: 4px; left: calc(50% - 2px); top: -5px; border-radius: 50%; background: var(--lime);
}
.hand-row .tile.selected {
  translate: 0 -7px; z-index: 1; outline: 2px solid var(--lime); outline-offset: 1px;
  box-shadow: inset 0 calc(-1 * var(--tile-edge)) #a8bf79, 0 4px 12px #101a10c9;
}
.hand-row .tile.locked { opacity: .64; }
.hand-row .tile.winning-tile { outline: 2px solid var(--amber); outline-offset: 1px; }
.melds { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.hand-console > .melds { margin-bottom: 9px; }
.meld-group { display: flex; gap: 2px; align-items: end; padding: 3px; border-radius: 5px; background: #102018; border: 1px solid #4f6b51; }
.meld-group .tile { width: 21px; --tile-edge: 2px; }
.meld-group .called-tile { rotate: 90deg; scale: .83; }
.action-area { margin-top: 12px; min-height: 44px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.action-left { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; min-width: 0; }
.action-left .ico { color: var(--lime); }
.action-left strong { color: var(--text); font-weight: 630; }
.action-buttons { display: flex; align-items: stretch; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.action-btn {
  min-height: 42px; display: inline-flex; justify-content: center; align-items: center; gap: 5px; padding: 0 11px;
  border: 1px solid #476044; border-radius: 7px; background: #2b3c2b; color: #d9e4d1;
  font-size: 12px; font-weight: 740; white-space: nowrap; transition: background .13s ease, border-color .13s ease;
}
.action-btn .ico { font-size: 16px; }
.action-btn:hover:not(:disabled), .action-btn[aria-pressed="true"] { background: #3b5334; border-color: #91aa6e; }
.action-btn:disabled { opacity: .5; }

  <script>
/* Tile IDs refer to physical copies. Tile kinds run 1m–9m, 1p–9p, 1s–9s, E S W N P F C. */
const Mahjong = (() => {
  const KINDS = Array.from({ length: 34 }, (_, i) => i);
  const WINDS = ['东', '南', '西', '北'];
  const HONORS = [...WINDS, '白', '发', '中'];
  const DIGITS = '一二三四五六七八九';
  const TERMINALS = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
  const GREEN = new Set([19, 20, 21, 23, 25, 32]);
  const RED_FIVES = new Set([4, 13, 22]);
  const kind = tile => Math.floor(tile / 4);
  const suit = k => Math.floor(k / 9);
  const rank = k => k % 9;
  const honor = k => k >= 27;
  const outside = k => honor(k) || rank(k) === 0 || rank(k) === 8;
  const isRed = tile => tile % 4 === 0 && RED_FIVES.has(kind(tile));
  const tileName = tile => {
    const k = kind(tile);
    return honor(k) ? (k === 31 ? '白板' : HONORS[k - 27]) :
      (isRed(tile) ? '赤' : '') + DIGITS[rank(k)] + '万筒索'[suit(k)];
  };
  const byTile = (a, b) => a - b;
  const counts = tiles => {
    const c = Array(34).fill(0);
    for (const tile of tiles) c[kind(tile)]++;
    return c;
  };
  const doraKind = k => k < 27 ? suit(k) * 9 + (rank(k) + 1) % 9 :
    k < 31 ? 27 + (k - 26) % 4 : 31 + (k - 30) % 3;

  // Cache Pareto-optimal combinations of sets, incomplete sets and a head per suit.
  const profileCache = [new Map(), new Map()];
  function profiles(block, suited) {
    const cache = profileCache[Number(suited)];
    const code = block.reduceRight((value, n) => value * 5 + n, 0);
    if (cache.has(code)) return cache.get(code);
    if (code === 0) return [[0, 0, 0]];
    const i = block.findIndex(n => n);
    const best = new Map();
    function take(indices, sets, partials, head) {
      for (const j of indices) block[j]--;
      for (const [m, t, p] of profiles(block, suited)) {
        if (p + head > 1) continue;
        const key = (m + sets) * 2 + p + head;
        best.set(key, Math.max(best.get(key) ?? -1, t + partials));
      }
      for (const j of indices) block[j]++;
    }
    take([i], 0, 0, 0);
    if (block[i] >= 2) {
      take([i, i], 0, 1, 0);
      take([i, i], 0, 0, 1);
    }
    if (block[i] >= 3) take([i, i, i], 1, 0, 0);
    if (suited) {
      if (block[i + 1]) take([i, i + 1], 0, 1, 0);
      if (block[i + 2]) take([i, i + 2], 0, 1, 0);
      if (block[i + 1] && block[i + 2]) take([i, i + 1, i + 2], 1, 0, 0);
    }
    const result = [...best].map(([key, t]) => [key >> 1, t, key & 1]);
    if (cache.size > 35000) cache.clear();
    cache.set(code, result);
    return result;
  }

  function shantenCounts(c, openSets = 0) {
    let result = 8;
    if (!openSets) {
      const unique = c.filter(n => n > 0).length;
      const pairs = c.filter(n => n >= 2).length;
      const distinctOrphans = TERMINALS.filter(k => c[k]).length;
      result = Math.min(6 - pairs + Math.max(0, 7 - unique),
        13 - distinctOrphans - Number(TERMINALS.some(k => c[k] >= 2)));
    }
    const blocks = [0, 9, 18, 27].map(start => profiles(c.slice(start, start + 9), start < 27));
    function combine(i, sets, partials, head) {
      if (i === 4) {
        result = Math.min(result, 8 - sets * 2 - Math.min(partials, 4 - sets) - head);
        return;
      }
      for (const [m, t, p] of blocks[i]) {
        if (sets + m <= 4 && head + p <= 1) combine(i + 1, sets + m, partials + t, head + p);
      }
    }
    combine(0, openSets, 0, 0);
    return result;
  }

  const shanten = (tiles, melds = []) => shantenCounts(counts(tiles), melds.length);
  function shapes(c, setsNeeded) {
    const result = [];
    if (setsNeeded === 4 && c.filter(n => n === 2).length === 7) result.push({ form: 'pairs' });
    if (setsNeeded === 4 && TERMINALS.every(k => c[k]) &&
        TERMINALS.reduce((sum, k) => sum + c[k], 0) === 14) result.push({ form: 'orphans' });
    const sets = [];
    function scan(from, left, head) {
      let k = from;
      while (k < 34 && !c[k]) k++;
      if (k === 34) {
        if (!left) result.push({ form: 'standard', head, sets: sets.slice() });
        return;
      }
      if (!left) return;
      if (c[k] >= 3) {
        c[k] -= 3;
        sets.push({ type: 'pon', k, open: false });
        scan(k, left - 1, head);
        sets.pop();
        c[k] += 3;
      }
      if (!honor(k) && rank(k) < 7 && c[k + 1] && c[k + 2]) {
        c[k]--; c[k + 1]--; c[k + 2]--;
        sets.push({ type: 'chi', k, open: false });
        scan(k, left - 1, head);
        sets.pop();
        c[k]++; c[k + 1]++; c[k + 2]++;
      }
    }
    for (const k of KINDS) {
      if (c[k] < 2) continue;
      c[k] -= 2;
      scan(0, setsNeeded, k);
      c[k] += 2;
    }
    return result;
  }

  function waits(tiles, melds = []) {
    const c = counts(tiles);
    if (tiles.length + melds.length * 3 !== 13 || shantenCounts(c, melds.length) !== 0) return [];
    const own = counts(tiles.concat(melds.flatMap(m => m.tiles)));
    return KINDS.filter(k => {
      if (own[k] === 4) return false;
      c[k]++;
      const valid = shapes(c, 4 - melds.length).length > 0;
      c[k]--;
      return valid;
    });
  }

  function payments(fu, han, dealer, tsumo) {
    const basic = BigInt(fu) << BigInt(han + 2);
    const round = n => (n + 99n) / 100n * 100n;
    if (!tsumo) {
      const ron = round(basic * (dealer ? 6n : 4n));
      return { basic, ron, total: ron };
    }
    const dealerShare = round(basic * 2n);
    const childShare = dealer ? dealerShare : round(basic);
    return { basic, dealerShare, childShare, total: dealer ? childShare * 3n : dealerShare + childShare * 2n };
  }

  function score({ tiles, melds = [], winning, tsumo = false, seat = 27, round = 27,
    riichi = 0, ippatsu = false, last = false, rinshan = false, chankan = false,
    blessing = false, indicators = [], ura = [], relics = [] }) {
    if (tiles.length + melds.length * 3 !== 14) return null;
    const c = counts(tiles);
    const patterns = shapes(c, 4 - melds.length);
    if (!patterns.length) return null;
    const allTiles = tiles.concat(melds.flatMap(m => m.tiles));
    const kinds = allTiles.map(kind);
    const all = counts(allTiles);
    const kWin = kind(winning);
    const closed = melds.every(m => !m.open);
    const fixedSets = melds.map(m => ({ type: m.type, open: m.open, k: Math.min(...m.tiles.map(kind)) }));
    const dora = indicators.reduce((sum, t) => sum + all[doraKind(kind(t))], 0);
    const red = allTiles.filter(isRed).length;
    const hidden = riichi ? ura.reduce((sum, t) => sum + all[doraKind(kind(t))], 0) : 0;
    const suitCount = new Set(kinds.filter(k => !honor(k)).map(suit)).size;
    const hasHonors = kinds.some(honor);
    const allOutside = kinds.every(outside);
    const simple = !kinds.some(outside);
    const dragons = [31, 32, 33];
    let best = null;

    function evaluate(pattern, position) {
      const standard = pattern.form === 'standard';
      const pairs = pattern.form === 'pairs';
      const orphans = pattern.form === 'orphans';
      const groups = standard ? [...pattern.sets, ...fixedSets] : [];
      const triplets = groups.filter(g => g.type !== 'chi');
      const sequences = groups.filter(g => g.type === 'chi');
      const kanCount = triplets.filter(g => g.type === 'kan').length;
      const isConcealed = g => !g.open && (tsumo || g !== pattern.sets?.[position]);
      const concealed = triplets.filter(isConcealed).length;
      const head = pattern.head;
      const tripletKinds = new Set(triplets.map(g => g.k));
      const dragonSets = dragons.filter(k => tripletKinds.has(k)).length;
      const windSets = [27, 28, 29, 30].filter(k => tripletKinds.has(k)).length;
      const pairFu = standard ? 2 * (Number(head === seat) + Number(head === round) + Number(dragons.includes(head))) : 0;
      const waitGroup = pattern.sets?.[position];
      const waitFu = position === -1 || (waitGroup?.type === 'chi' &&
        (kWin === waitGroup.k + 1 ||
        (rank(waitGroup.k) === 0 && kWin === waitGroup.k + 2) ||
        (rank(waitGroup.k) === 6 && kWin === waitGroup.k))) ? 2 : 0;
      const pinfu = standard && closed && sequences.length === 4 && pairFu === 0 && waitFu === 0;
      const yakuman = [];
      const yaku = [];
      const add = (name, han, id) => yaku.push({ name, han, id, category: 'yaku' });
      const limit = (name, multiple = 1) => yakuman.push({ name, han: 13 * multiple, category: 'yakuman' });
      if (blessing && tsumo) limit(seat === 27 ? '天和' : '地和');
      if (orphans) limit(c[kWin] === 2 ? '国士无双十三面' : '国士无双', c[kWin] === 2 ? 2 : 1);
      if (dragonSets === 3) limit('大三元');
      if (windSets === 4) limit('大四喜', 2);
      if (windSets === 3 && head >= 27 && head <= 30) limit('小四喜');
      if (concealed === 4) limit(position === -1 ? '四暗刻单骑' : '四暗刻', position === -1 ? 2 : 1);
      if (kanCount === 4) limit('四杠子');
      if (kinds.every(honor)) limit('字一色');
      if (!hasHonors && allOutside) limit('清老头');
      if (kinds.every(k => GREEN.has(k))) limit('绿一色');
      if (closed && !melds.length && suitCount === 1 && !hasHonors) {
        const start = suit(kWin) * 9;
        const nine = [3, 1, 1, 1, 1, 1, 1, 1, 3];
        if (nine.every((n, i) => all[start + i] >= n)) {
          const pure = nine.every((n, i) => all[start + i] - Number(start + i === kWin) === n);
          limit(pure ? '纯正九莲宝灯' : '九莲宝灯', pure ? 2 : 1);
        }
      }

      if (!yakuman.length) {
        if (riichi) add(riichi === 2 ? '两立直' : '立直', riichi, 'riichi');
        if (riichi && ippatsu) add('一发', 1);
        if (tsumo && closed) add('门前清自摸和', 1);
        if (last) add(tsumo ? '海底摸月' : '河底捞鱼', 1);
        if (rinshan) add('岭上开花', 1);
        if (chankan) add('抢杠', 1);
        if (simple) add('断幺九', 1, 'tanyao');
        if (suitCount === 1) add(hasHonors ? '混一色' : '清一色',
          hasHonors ? (closed ? 3 : 2) : (closed ? 6 : 5));
        if (allOutside) add('混老头', 2);
        if (pairs) add('七对子', 2);
        if (standard) {
          if (pinfu) add('平和', 1);
          if (triplets.length === 4) add('对对和', 2);
          if (concealed === 3) add('三暗刻', 2);
          if (kanCount === 3) add('三杠子', 2);
          if (dragonSets === 2 && dragons.includes(head)) add('小三元', 2);
          if (tripletKinds.has(seat)) add('自风・' + HONORS[seat - 27], 1);
          if (tripletKinds.has(round)) add('场风・' + HONORS[round - 27], 1);
          for (const k of dragons) if (tripletKinds.has(k)) add('役牌・' + HONORS[k - 27], 1);
          const seqCount = new Map();
          for (const g of sequences) seqCount.set(g.k, (seqCount.get(g.k) ?? 0) + 1);
          if (closed) {
            const duplicates = [...seqCount.values()].reduce((sum, n) => sum + Math.floor(n / 2), 0);
            if (duplicates) add(duplicates === 2 ? '二杯口' : '一杯口', duplicates === 2 ? 3 : 1);
          }
          if ([0, 1, 2, 3, 4, 5, 6].some(i => [i, i + 9, i + 18].every(k => seqCount.has(k))))
            add('三色同顺', closed ? 2 : 1);
          if ([0, 1, 2, 3, 4, 5, 6, 7, 8].some(i => [i, i + 9, i + 18].every(k => tripletKinds.has(k))))
            add('三色同刻', 2);
          if ([0, 9, 18].some(i => [i, i + 3, i + 6].every(k => seqCount.has(k))))
            add('一气通贯', closed ? 2 : 1);
          if (sequences.length && outside(head) &&
              triplets.every(g => outside(g.k)) && sequences.every(g => [0, 6].includes(rank(g.k)))) {
            add(hasHonors ? '混全带幺九' : '纯全带幺九', hasHonors ? (closed ? 2 : 1) : (closed ? 3 : 2));
          }
        }
      }

      const legal = yakuman.length ? yakuman : yaku;
      if (!legal.length) return; // Bonus han cannot supply the hand's first yaku.
      let fu = orphans ? 30 : pairs ? 25 : 20;
      if (standard && !(pinfu && tsumo)) {
        fu += pairFu + waitFu + (tsumo ? 2 : closed ? 10 : 0);
        for (const g of triplets) {
          fu += 2 * (outside(g.k) ? 2 : 1) * (isConcealed(g) ? 2 : 1) * (g.type === 'kan' ? 4 : 1);
        }
        fu = Math.max(30, Math.ceil(fu / 10) * 10);
      }
      const details = legal.slice();
      if (dora) details.push({ name: '宝牌', han: dora, category: 'dora' });
      if (red) details.push({ name: '赤宝牌', han: red, category: 'dora' });
      if (hidden) details.push({ name: '里宝牌', han: hidden, category: 'dora' });
      const baseFu = fu;
      for (const relic of relics) {
        if (relic.id === 'seal') {
          fu += 10;
          details.push({ name: relic.name, fu: 10, category: 'relic' });
          continue;
        }
        const triggered = {
          bell: riichi > 0, moon: tsumo, hunter: !tsumo, jade: simple,
          mirror: dora + red + hidden > 0, spark: !closed, silence: !riichi
        };
        if (triggered[relic.id]) details.push({ name: relic.name, han: 1, category: 'relic' });
      }
      const han = details.reduce((total, row) => total + (row.han ?? 0), 0);
      const payout = payments(fu, han, seat === 27, tsumo);
      if (!best || payout.total > best.payout.total ||
          (payout.total === best.payout.total && han > best.han)) {
        best = { han, fu, baseFu, details, payout, form: pattern.form };
      }
    }

    for (const pattern of patterns) {
      if (pattern.form !== 'standard') {
        evaluate(pattern, -2);
        continue;
      }
      if (pattern.head === kWin) evaluate(pattern, -1);
      pattern.sets.forEach((g, i) => {
        if (g.type === 'chi' ? kWin >= g.k && kWin <= g.k + 2 : kWin === g.k) evaluate(pattern, i);
      });
    }
    return best;
  }

  function improvement(c, meldCount, distance, seen) {
    const result = [];
    for (const k of KINDS) {
      if (c[k] >= 4 || seen[k] >= 4) continue;
      c[k]++;
      const better = shantenCounts(c, meldCount) < distance;
      c[k]--;
      if (better) result.push({ k, left: 4 - seen[k] });
    }
    return result;
  }

  function discardOptions(tiles, melds, seen, allowed, indicators, detailCount = 6) {
    const c = counts(tiles);
    const dora = indicators.map(t => doraKind(kind(t)));
    const candidates = [];
    const checked = new Set();
    for (const tile of allowed) {
      const k = kind(tile);
      const variant = k * 2 + Number(isRed(tile));
      if (checked.has(variant)) continue;
      checked.add(variant);
      c[k]--;
      const distance = shantenCounts(c, melds.length);
      let value = c[k] * 4 + (isRed(tile) ? 14 : 0) + dora.filter(n => n === k).length * 9;
      if (!honor(k)) {
        const number = rank(k);
        value += 4 - Math.abs(4 - number);
        if (number >= 1) value += c[k - 1] * 2;
        if (number <= 7) value += c[k + 1] * 2;
        if (number >= 2) value += c[k - 2];
        if (number <= 6) value += c[k + 2];
      }
      c[k]++;
      candidates.push({ tile, k, distance, value, incoming: [], outs: 0 });
    }
    candidates.sort((a, b) => a.distance - b.distance || a.value - b.value);
    for (const option of candidates.slice(0, detailCount)) {
      c[option.k]--;
      option.incoming = improvement(c, melds.length, option.distance, seen);
      option.outs = option.incoming.reduce((total, row) => total + row.left, 0);
      c[option.k]++;
    }
    return candidates.sort((a, b) => a.distance - b.distance || b.outs - a.outs || a.value - b.value);
  }

  function canRiichiKan(tiles, melds, drawn, k) {
    if (kind(drawn) !== k) return false;
    const old = tiles.filter(t => t !== drawn);
    const oldWaits = waits(old, melds);
    const group = { type: 'kan', open: false, tiles: tiles.filter(t => kind(t) === k) };
    const next = waits(tiles.filter(t => kind(t) !== k), [...melds, group]);
    if (!oldWaits.length || oldWaits.join(',') !== next.join(',')) return false;
    const c = counts(old);
    return oldWaits.every(w => {
      c[w]++;
      const onlyTriplet = shapes(c, 4 - melds.length).every(p => p.form === 'standard' &&
        p.sets.some(g => g.type === 'pon' && g.k === k));
      c[w]--;
      return onlyTriplet;
    });
  }

  return { KINDS, WINDS, HONORS, DIGITS, kind, suit, rank, honor, outside, isRed, byTile, tileName,
    counts, doraKind, shanten, shantenCounts, shapes, waits, payments, score, improvement,
    discardOptions, canRiichiKan };
})();

  <script>
const Endless = (() => {
  const M = Mahjong;
  const NAMES = ['你', '赤狐', '玄雀', '白鹭'];
  const STAGES = ['初席', '夜巡', '幽谷', '回廊', '破境', '望月', '天门', '重云'];
  const RELICS = [
    { id: 'bell', glyph: 'bell', name: '听风铃', label: '立直', effect: '立直和牌时 +1 翻。' },
    { id: 'moon', glyph: 'moon', name: '捞月盏', label: '自摸', effect: '自摸和牌时 +1 翻。' },
    { id: 'hunter', glyph: 'target', name: '朱雀箭', label: '荣和', effect: '荣和时 +1 翻。' },
    { id: 'jade', glyph: 'gem', name: '断玉', label: '断幺', effect: '只用中张牌和牌时 +1 翻。' },
    { id: 'mirror', glyph: 'sun', name: '宝鉴', label: '宝牌', effect: '和牌含任意宝牌时 +1 翻。' },
    { id: 'seal', glyph: 'seal', name: '方圆印', label: '符数', effect: '每次和牌在结算后额外 +10 符。' },
    { id: 'spark', glyph: 'flame', name: '燎原火', label: '副露', effect: '有吃、碰或明杠的和牌 +1 翻。' },
    { id: 'silence', glyph: 'feather', name: '静羽', label: '默听', effect: '未宣告立直时和牌 +1 翻。' },
    { id: 'heal', glyph: 'heart', name: '续命符', label: '余命', effect: '立即额外回复 1 命，上限 4。' }
  ];
  const nextSeat = (from, distance = 1) => (from + distance) % 4;
  const seatOrder = from => [1, 2, 3].map(distance => nextSeat(from, distance));
  const sortTiles = tiles => tiles.sort(M.byTile);
  const stageName = floor => STAGES[(floor - 1) % STAGES.length];
  const nameOf = index => index === 0 ? '你' : NAMES[index];

  function shuffle(items, random) {
    const result = items.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function player(tiles, points) {
    return { tiles: sortTiles(tiles), points, melds: [], river: [], drawn: null, drawType: null,
      riichi: 0, ippatsu: false, temporaryFuriten: false, riichiFuriten: false, turns: 0, forbidden: [] };
  }

  function makeTable({ dealer, roundIndex, honba, pot, points, guide, floor, random }) {
    const tiles = Array.from({ length: 136 }, (_, i) => i);
    let hands, live, dead;
    if (guide) {
      live = shuffle(tiles, random);
      const pluck = (k, red = false) => live.splice(live.findIndex(t => M.kind(t) === k && M.isRed(t) === red), 1)[0];
      const start = [1, 2, 3, 12, 13, 14, 19, 20, 21, 22, 22, 23, 24].map(k => pluck(k, k === 13));
      const first = pluck(31);
      const teachingDraw = pluck(25);
      const indicator = pluck(14);
      hands = [start, ...Array.from({ length: 3 }, () => live.splice(0, 13))];
      dead = live.splice(-13);
      dead.splice(4, 0, indicator);
      live.splice(3, 0, teachingDraw);
      live.unshift(first);
    } else {
      for (let attempt = 0; attempt < 15; attempt++) {
        live = shuffle(tiles, random);
        hands = Array.from({ length: 4 }, () => live.splice(0, 13));
        dead = live.splice(-14);
        if (M.shanten(hands[0]) <= (floor < 6 ? 2 : 3)) break;
      }
    }
    return {
      dealer, roundIndex, honba, pot, guide, players: hands.map((tiles, i) => player(tiles, points[i])),
      live, rinshan: dead.slice(0, 4), indicators: dead.filter((_, i) => i >= 4 && i % 2 === 0),
      ura: dead.filter((_, i) => i >= 4 && i % 2 === 1), deadShift: [],
      kanCount: 0, calls: 0, turn: dealer, phase: 'draw', reaction: null,
      number: 0, result: null, last: null
    };
  }

  function blankRun() {
    return {
      version: 1, floor: 1, goal: '8000', progress: '0', total: '0', highest: '0',
      hearts: 4, wins: 0, hands: 0, relics: [], rewards: [], view: 'play',
      events: [], table: null
    };
  }

  class Game {
    constructor(snapshot = null, random = Math.random) {
      this.random = random;
      this.s = snapshot ?? blankRun();
      if (!snapshot) {
        this.s.table = makeTable({
          dealer: 0, roundIndex: 0, honba: 0, pot: 0, points: Array(4).fill('25000'), guide: true,
          floor: 1, random
        });
        this.log('info', '入席。第 01 层 · 初席。');
        this.draw(0);
      }
    }

    get t() { return this.s.table; }
    get you() { return this.t.players[0]; }
    get indicators() { return this.t.indicators.slice(0, this.t.kanCount + 1); }
    get round() { return 27 + Math.floor(this.t.roundIndex / 4) % 4; }
    seat(index) { return 27 + (index - this.t.dealer + 4) % 4; }

    log(type, message) {
      this.s.events.unshift({ type, message });
      if (this.s.events.length > 80) this.s.events.length = 80;
    }

    draw(index, supplement = false) {

      if (!supplement && !t.live.length) return this.exhaustive();

      p.tiles.push(tile);

      p.drawType = supplement ? 'rinshan' : 'live';

      t.turn = index;
      t.phase = 'turn';
      t.reaction = null;

    }

    visible(index) {
      const tiles = new Set([...this.t.players[index].tiles, ...this.indicators]);
      for (const p of this.t.players) {
        for (const row of p.river) if (!row.called) tiles.add(row.tile);
        for (const meld of p.melds) for (const tile of meld.tiles) tiles.add(tile);

    }

    legalDiscards(index) {

        p.tiles.filter(t => !p.forbidden.includes(M.kind(t)));
    }

    options(index, detailCount = 6) {

      return M.discardOptions(p.tiles, p.melds, this.visible(index),
        this.legalDiscards(index), this.indicators, detailCount);
    }

    riichiDiscards(index) {
      const t = this.t;
      const p = t.players[index];
      if (t.phase !== 'turn' || t.turn !== index || p.riichi || t.live.length < 4 ||
          BigInt(p.points) < 1000n || p.melds.some(m => m.open)) return [];
      const c = M.counts(p.tiles);
      const opts = new Map();
      return this.legalDiscards(index).filter(tile => {
        const k = M.kind(tile);
        if (!opts.has(k)) {
          c[k]--;
          opts.set(k, M.shantenCounts(c, p.melds.length) === 0 &&
            M.waits(p.tiles.filter(t => t !== tile), p.melds).length > 0);
          c[k]++;
        }
        return opts.get(k);
      });
    }

    score(index, tile, method, flags = {}) {
      const t = this.t;
      const p = t.players[index];
      const tsumo = method === 'tsumo';
      return M.score({
        tiles: tsumo ? p.tiles : p.tiles.concat(tile), melds: p.melds, winning: tile,
        tsumo, seat: this.seat(index), round: this.round, riichi: p.riichi, ippatsu: p.ippatsu,
        last: tsumo ? p.drawType === 'live' && !t.live.length : !!flags.last,
        rinshan: tsumo && p.drawType === 'rinshan', chankan: !!flags.kan,
        blessing: tsumo && !t.calls && p.turns === 0 && p.drawType === 'live',
        indicators: this.indicators, ura: t.ura.slice(0, t.kanCount + 1),
        relics: index === 0 ? this.s.relics.map(id => RELICS.find(r => r.id === id)) : []
      });
    }

    canTsumo(index) {
      const p = this.t.players[index];
      return p.drawn !== null ? this.score(index, p.drawn, 'tsumo') : null;
    }

    canRon(index, reaction) {
      const p = this.t.players[index];
      if (p.temporaryFuriten || p.riichiFuriten) return null;
      const score = this.score(index, reaction.tile, 'ron', reaction);
      if (!score || (reaction.kan === 'closed' && score.form !== 'orphans')) return null;
      const waits = M.waits(p.tiles, p.melds);
      if (!waits.includes(M.kind(reaction.tile)) || p.river.some(row => waits.includes(M.kind(row.tile)))) return null;
      return score;
    }

    discard(index, tile, declare = false) {
      const t = this.t;
      if (t.phase !== 'turn' || t.turn !== index || !this.legalDiscards(index).includes(tile)) return false;
      if (declare && !this.riichiDiscards(index).includes(tile)) return false;
      const p = t.players[index];
      const double = declare && p.turns === 0 && !t.calls;
      const last = !t.live.length && p.drawType === 'live';
      p.tiles.splice(p.tiles.indexOf(tile), 1);
      sortTiles(p.tiles);
      p.river.push({ tile, riichi: declare, called: false });
      p.turns++;
      p.ippatsu = false;
      p.drawn = null;
      p.drawType = null;
      p.forbidden = [];
      t.last = { from: index, tile };
      this.log(declare ? 'accent' : 'turn', nameOf(index) + (declare ? '宣告' + (double ? '两立直' : '立直') + '，打出' : '打出') + M.tileName(tile) + '。');
      this.react({ from: index, tile, last, declare: declare ? (double ? 2 : 1) : 0 });
      return true;
    }

    react(reaction) {
      const t = this.t;
      t.reaction = reaction;
      t.phase = 'reaction';
      const order = seatOrder(reaction.from);
      reaction.ron = order.filter(i => this.canRon(i, reaction));
      if (reaction.ron[0] === 0) {
        reaction.offers = [{ id: 'ron', type: 'ron', tiles: [reaction.tile] }];
        return;
      }
      if (reaction.ron.length) return this.ron(reaction.ron[0], reaction);
      this.afterRon(reaction, true);
    }

    afterRon(reaction, allowHuman) {
      const t = this.t;
      if (reaction.kan) return this.finishKan(reaction.from, reaction.ownKan);
      if (reaction.declare) {
        const p = t.players[reaction.from];
        p.riichi = reaction.declare;
        p.ippatsu = true;
        p.points = (BigInt(p.points) - 1000n).toString();
        t.pot++;
        reaction.declare = 0;
      }
      const order = seatOrder(reaction.from);
      const rank = option => option.type === 'chi' ? 1 : 2;
      const bots = t.guide ? [] : order.flatMap(index => {
        if (index === 0) return [];
        return this.calls(index, reaction)
          .filter(option => this.botWouldCall(index, option, reaction))
          .map(option => ({ index, option }));
      });
      bots.sort((a, b) => rank(b.option) - rank(a.option) || order.indexOf(a.index) - order.indexOf(b.index));
      const bot = bots[0];
      const offers = allowHuman && order.includes(0) ? this.calls(0, reaction).filter(option =>
        !bot || rank(option) > rank(bot.option) ||
        (rank(option) === rank(bot.option) && order.indexOf(0) < order.indexOf(bot.index))) : [];
      if (offers.length) {
        reaction.offers = offers;
        reaction.bot = bot ?? null;
        return;
      }
      if (bot) return this.finishCall(bot.index, bot.option, reaction);
      this.draw(nextSeat(reaction.from));
    }

    calls(index, reaction) {
      const p = this.t.players[index];
      if (p.riichi || !this.t.live.length) return [];
      const k = M.kind(reaction.tile);
      const options = [];
      const matching = p.tiles.filter(t => M.kind(t) === k).sort((a, b) => Number(M.isRed(b)) - Number(M.isRed(a)));
      if (matching.length >= 2) options.push({ id: 'pon', type: 'pon', tiles: matching.slice(0, 2), forbidden: [k] });
      if (matching.length >= 3 && this.t.kanCount < 4) options.push({ id: 'minkan', type: 'kan', tiles: matching, forbidden: [] });
      if (!M.honor(k) && index === nextSeat(reaction.from)) {
        for (let start = k - 2; start <= k; start++) {
          if (start < 0 || M.suit(start) !== M.suit(k) || M.suit(start + 2) !== M.suit(k)) continue;
          const needed = [start, start + 1, start + 2].filter(n => n !== k);
          const found = needed.map(n => p.tiles.find(t => M.kind(t) === n));
          if (found.some(t => t === undefined)) continue;
          const forbidden = [k];
          if (k === start && M.rank(k) <= 5) forbidden.push(k + 3);
          if (k === start + 2 && M.rank(k) >= 3) forbidden.push(k - 3);
          if (p.tiles.some(t => !found.includes(t) && !forbidden.includes(M.kind(t)))) {
            options.push({ id: 'chi-' + start, type: 'chi', tiles: found, forbidden });
          }
        }
      }
      return options.filter(option => option.type === 'kan' || p.tiles.some(t =>
        !option.tiles.includes(t) && !option.forbidden.includes(M.kind(t))));
    }

    botWouldCall(index, option, reaction) {
      const k = M.kind(reaction.tile);
      if (option.type !== 'pon' || (k !== this.seat(index) && k !== this.round && k < 31)) return false;
      const p = this.t.players[index];
      const left = p.tiles.filter(t => !option.tiles.includes(t));
      const melds = [...p.melds, { type: 'pon', open: true, tiles: [...option.tiles, reaction.tile] }];
      const best = Math.min(...left.filter(t => !option.forbidden.includes(M.kind(t))).map(tile =>
        M.shanten(left.filter(t => t !== tile), melds)));
      return best < M.shanten(p.tiles, p.melds);
    }

    interruptIppatsu() {
      this.t.calls++;
      for (const p of this.t.players) p.ippatsu = false;
    }

    finishCall(index, option, reaction) {
      this.interruptIppatsu();
      const t = this.t;
      const p = t.players[index];
      const river = t.players[reaction.from].river;
      river[river.length - 1].called = true;
      p.tiles = p.tiles.filter(tile => !option.tiles.includes(tile));
      p.melds.push({
        type: option.type, open: true, tiles: sortTiles([...option.tiles, reaction.tile]),
        from: reaction.from, called: reaction.tile
      });
      const call = { chi: '吃', pon: '碰', kan: '明杠' }[option.type];
      this.log('accent', nameOf(index) + call + M.tileName(reaction.tile) + '。');
      if (option.type === 'kan') return this.supplement(index);
      p.drawn = null;
      p.drawType = 'call';
      p.forbidden = option.forbidden;
      t.turn = index;
      t.phase = 'turn';
      t.reaction = null;
    }

    selfKans(index) {
      const t = this.t;
      const p = t.players[index];
      if (t.phase !== 'turn' || t.turn !== index || p.drawn === null || t.kanCount >= 4 || !t.live.length) return [];
      const c = M.counts(p.tiles);
      const options = [];
      for (const k of M.KINDS) {
        if (c[k] !== 4 || (p.riichi && !M.canRiichiKan(p.tiles, p.melds, p.drawn, k))) continue;
        options.push({ id: 'closed-' + k, type: 'closed', tiles: p.tiles.filter(t => M.kind(t) === k) });
      }
      if (!p.riichi) p.melds.forEach((m, i) => {
        if (m.type !== 'pon') return;
        const tile = p.tiles.find(t => M.kind(t) === M.kind(m.tiles[0]));
        if (tile !== undefined) options.push({ id: 'added-' + i, type: 'added', tiles: [tile], meld: i });
      });
      return options;
    }

    declareKan(index, id) {
      const option = this.selfKans(index).find(o => o.id === id);
      if (!option) return false;
      const tile = option.tiles[0];
      this.log('accent', nameOf(index) + '宣告' + (option.type === 'closed' ? '暗杠' : '加杠') + M.tileName(tile) + '。');
      this.interruptIppatsu();
      this.react({ from: index, tile, kan: option.type, ownKan: option });
      return true;
    }

    finishKan(index, option) {
      const p = this.t.players[index];
      p.tiles = p.tiles.filter(tile => !option.tiles.includes(tile));
      if (option.type === 'closed') p.melds.push({ type: 'kan', open: false, tiles: sortTiles(option.tiles.slice()) });
      else {
        const meld = p.melds[option.meld];
        meld.type = 'kan';
        meld.tiles = sortTiles(meld.tiles.concat(option.tiles));
      }
      this.supplement(index);
    }

    supplement(index) {
      this.t.kanCount++;
      this.t.deadShift.push(this.t.live.pop());
      this.draw(index, true);
    }

    respond(id) {
      const r = this.t.reaction;
      if (this.t.phase !== 'reaction' || !r?.offers) return false;
      if (id === 'pass') {
        if (r.ron[0] === 0) {
          this.you.temporaryFuriten = true;
          if (this.you.riichi) this.you.riichiFuriten = true;
          if (r.ron.length > 1) this.ron(r.ron[1], r);
          else this.afterRon(r, false);
        } else if (r.bot) this.finishCall(r.bot.index, r.bot.option, r);
        else this.draw(nextSeat(r.from));
        return true;
      }
      const option = r.offers.find(o => o.id === id);
      if (!option) return false;
      if (id === 'ron') this.ron(0, r);
      else this.finishCall(0, option, r);
      return true;
    }

    ron(index, reaction) {
      this.win(index, reaction.tile, 'ron', this.canRon(index, reaction), reaction.from);
    }

    tsumo(index) {
      if (this.t.phase !== 'turn' || this.t.turn !== index) return false;
      const result = this.canTsumo(index);
      if (!result) return false;
      this.win(index, this.t.players[index].drawn, 'tsumo', result);
      return true;
    }

    botTurn() {
      const t = this.t;
      const i = t.turn;
      if (t.phase !== 'turn' || i === 0) return false;
      if (this.tsumo(i)) return true;
      const p = t.players[i];
      const kan = this.selfKans(i).find(o => o.type === 'closed');
      if (kan && !t.guide && this.random() < 0.4) return this.declareKan(i, kan.id);
      if (p.riichi) return this.discard(i, p.drawn);
      const riichi = new Set(this.riichiDiscards(i));
      const options = this.options(i, i === 2 ? 7 : 5);
      const threats = t.players.filter((op, index) => index !== i && op.riichi);
      const danger = option => threats.filter(op => !op.river.some(row => M.kind(row.tile) === option.k)).length;
      if (threats.length && options[0].distance >= 2) {
        options.sort((a, b) => (a.distance + danger(a) * 1.4) - (b.distance + danger(b) * 1.4));
      }
      const tile = options[0].tile;
      return this.discard(i, tile, riichi.has(tile) && (i !== 3 || this.random() < 0.82));
    }

    win(index, tile, method, score, from = null) {
      const t = this.t;
      const tsumo = method === 'tsumo';
      const honba = BigInt(t.honba) * 100n;
      const deltas = [0n, 0n, 0n, 0n];
      if (tsumo) {
        for (let i = 0; i < 4; i++) {
          if (i === index) continue;
          deltas[i] -= (i === t.dealer ? score.payout.dealerShare : score.payout.childShare) + honba;
        }
      } else deltas[from] -= score.payout.ron + honba * 3n;
      deltas[index] = -deltas.reduce((sum, n) => sum + n, 0n) + BigInt(t.pot) * 1000n;
      const p = t.players[index];
      const details = {
        type: 'win', winner: index, from, method, winning: tile,
        score: score.payout.total.toString(), actual: deltas[index].toString(),
        basic: score.payout.basic.toString(), han: score.han, fu: score.fu, baseFu: score.baseFu,
        details: score.details, payments: Object.fromEntries(Object.entries(score.payout).map(([k, n]) => [k, n.toString()])),
        tiles: sortTiles(p.tiles.filter(t => t !== tile)), melds: p.melds,
        indicators: this.indicators, ura: p.riichi ? t.ura.slice(0, t.kanCount + 1) : [],
        honba: t.honba, sticks: t.pot
      };
      t.pot = 0;
      this.log(index === 0 ? 'win' : 'warn', nameOf(index) + (tsumo ? '自摸' : '荣和') + '，' +
        score.han + ' 翻 ' + score.fu + ' 符。');
      this.settle(details, deltas, index === t.dealer);
    }

    exhaustive() {
      const tenpai = this.t.players.map(p => M.waits(p.tiles, p.melds).length > 0);
      const n = tenpai.filter(Boolean).length;
      const deltas = tenpai.map(ready => !n || n === 4 ? 0n : ready ? 3000n / BigInt(n) : -3000n / BigInt(4 - n));
      this.log('warn', '牌山已空。荒牌流局。');
      this.settle({ type: 'draw', tenpai }, deltas, tenpai[this.t.dealer]);
    }

    settle(result, deltas, dealerStays) {
      const t = this.t;
      const run = this.s;
      t.players.forEach((p, i) => { p.points = (BigInt(p.points) + deltas[i]).toString(); });
      t.phase = 'resolved';
      t.reaction = null;
      run.hands++;
      if (result.winner === 0) {
        const points = BigInt(result.score);
        run.wins++;
        run.total = (BigInt(run.total) + points).toString();
        run.progress = (BigInt(run.progress) + points).toString();
        if (points > BigInt(run.highest)) run.highest = points.toString();
      } else run.hearts--;
      const clear = BigInt(run.progress) >= BigInt(run.goal);
      t.result = { ...result, deltas: deltas.map(String), dealerStays, clear };
      run.view = 'result';
    }

    continueResult() {
      if (this.s.view !== 'result') return false;
      if (this.s.hearts === 0) {
        this.s.view = 'over';
      } else if (this.t.result.clear) {
        const choices = RELICS.filter(r => r.id !== 'heal' || this.s.hearts <= 2);
        this.s.rewards = shuffle(choices, this.random).slice(0, 3).map(r => r.id);
        this.s.view = 'reward';
      } else this.nextHand(false);
      return true;
    }

    chooseRelic(id) {
      const run = this.s;
      if (run.view !== 'reward' || !run.rewards.includes(id)) return false;
      run.hearts = Math.min(4, run.hearts + (id === 'heal' ? 2 : 1));
      if (id !== 'heal') run.relics.push(id);
      this.log('win', '第 ' + run.floor + ' 层通过。获得「' + RELICS.find(r => r.id === id).name + '」。');
      run.floor++;
      run.goal = ((BigInt(run.goal) * 142n + 9999n) / 10000n * 100n).toString();
      run.progress = '0';
      run.rewards = [];
      this.nextHand(true);
      return true;
    }

    nextHand(newFloor) {
      const old = this.t;
      const stays = old.result.dealerStays;
      const dealer = stays ? old.dealer : nextSeat(old.dealer);
      this.s.table = makeTable({
        dealer, roundIndex: old.roundIndex + Number(!stays),
        honba: newFloor ? 0 : stays || old.result.type === 'draw' ? old.honba + 1 : 0,
        pot: newFloor ? 0 : old.pot,
        points: newFloor ? Array(4).fill('25000') : old.players.map(p => p.points),
        guide: false, floor: this.s.floor, random: this.random
      });
      this.s.view = 'play';
      this.log('info', '第 ' + this.s.floor + ' 层 · ' + stageName(this.s.floor) + '，' + this.roundName() + '。');
      this.draw(dealer);
    }

    roundName() {
      return M.WINDS[this.round - 27] + ['一', '二', '三', '四'][this.t.roundIndex % 4] + '局';
    }
  }

  return { Game, NAMES, STAGES, RELICS, stageName };
})();
